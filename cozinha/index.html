<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest-cozinha.json">
<meta name="theme-color" content="#1F4A38">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Cozinha — Emma's Place</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Jost:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--cream:#F3ECDD;--card:#FBF7EE;--line:#E5D9C2;--ink:#3B2314;--ink2:#7A5A3C;
 --gold:#C89B6D;--dark:#2E2018;--vermelho:#8C2F2F;--verde:#2E6B32;}
body{background:var(--cream);color:var(--ink);font-family:'Jost',system-ui,sans-serif;
 padding-bottom:24px;-webkit-text-size-adjust:100%;}
.wrap{max-width:900px;margin:0 auto;padding:18px 14px;}
h1{font-family:'Playfair Display',serif;font-size:24px;}
.sub{font-size:13.5px;color:var(--ink2);font-weight:300;margin-top:3px;}
.hoje{font-size:12.5px;color:var(--gold);font-weight:600;letter-spacing:1px;margin-top:5px;}

.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px;}
.fld{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;
 font-family:inherit;font-size:16px;color:var(--ink);}
.btn{width:100%;padding:14px;border-radius:40px;background:var(--dark);color:#F7F1E4;
 border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:10px;}
.msg{font-size:14px;margin-top:10px;min-height:18px;}
.msg.bad{color:var(--vermelho);}

.filtros{display:flex;gap:7px;margin:16px 0 4px;}
.fb{flex:1;padding:11px 6px;border-radius:30px;border:2px solid var(--line);background:var(--card);
 font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);}
.fb.sel{background:var(--dark);color:#F7F1E4;border-color:var(--dark);}

.grid{display:grid;grid-template-columns:1fr;gap:11px;margin-top:12px;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
.ped{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 15px;}
.ped.preparar{border-color:var(--gold);background:#FFF9EF;}
.ped.pronto{border-color:#9CC29C;background:#EEF6EE;}
.ped .top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.ped .hora{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;line-height:1;}
.ped .tipo{font-size:11.5px;letter-spacing:1.5px;font-weight:600;padding:4px 10px;border-radius:20px;
 background:var(--dark);color:#F7F1E4;white-space:nowrap;}
.ped .tipo.ent{background:var(--gold);color:var(--dark);}
.ped .cli{font-size:15px;color:var(--ink);margin-top:6px;}
.ped .cli .tel{color:var(--verde);font-weight:600;text-decoration:none;}
.ped .meta{font-family:monospace;font-size:12px;color:var(--ink2);margin-top:3px;}
.ped .mor{font-size:14px;color:var(--ink2);margin-top:8px;line-height:1.4;}
.ped ul{list-style:none;margin:10px 0 0;}
.ped li{font-size:17px;font-weight:500;padding:5px 0;border-bottom:1px dotted var(--line);line-height:1.35;}
.ped li:last-child{border-bottom:none;}
.ped .nt{font-size:14px;color:#8C2F2F;margin-top:8px;font-weight:500;}
.ped .est{font-size:11.5px;letter-spacing:1.5px;font-weight:600;color:var(--ink2);margin-top:9px;}
.ped .acts{display:flex;gap:7px;margin-top:11px;}
.ped .acts button{flex:1;padding:13px 6px;border-radius:30px;border:none;
 font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.bnx{background:var(--dark);color:#F7F1E4;}
.bok{background:var(--verde);color:#fff;}
.abas{display:flex;gap:8px;margin:16px 0 4px;}
.abab{flex:1;padding:13px;border-radius:30px;border:2px solid var(--line);background:var(--card);
 font-size:15.5px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink);}
.abab.sel{background:var(--dark);color:#F7F1E4;border-color:var(--dark);}
.avisoStk{background:#FFF6E2;border:1px solid var(--gold);border-radius:12px;padding:11px 13px;
 font-size:13.5px;color:#6E4B2F;line-height:1.5;margin:12px 0;}
.scat{font-size:12.5px;letter-spacing:2px;font-weight:600;color:#8B5E3C;margin:18px 0 7px;}
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
 border-radius:15px;padding:11px 12px;margin-bottom:9px;}
.srow.zero{background:#F6E9E6;border-color:#D9B4AC;}
.srow .sn{flex:1;font-size:16px;line-height:1.25;font-weight:500;}
.srow.zero .sn{color:var(--vermelho);text-decoration:line-through;}
.srow .sq{min-width:52px;text-align:center;font-family:'Playfair Display',serif;
 font-size:27px;font-weight:800;color:var(--verde);}
.srow.zero .sq{color:var(--vermelho);}
.srow .sminus{flex:none;width:76px;height:56px;border-radius:16px;border:none;background:var(--dark);
 color:#F7F1E4;font-size:22px;font-weight:700;cursor:pointer;font-family:inherit;}
.srow .sminus:disabled{opacity:.3;}
.srow .stog{flex:none;width:62px;height:56px;border-radius:16px;border:none;cursor:pointer;
 font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;}
.stog.on{background:var(--verde);color:#fff;}
.stog.no{background:var(--vermelho);color:#fff;}
.semstk{font-size:13px;color:var(--ink2);font-weight:300;}
.vazio{text-align:center;padding:30px 12px;color:var(--ink2);font-weight:300;}
.atr{background:#F6E9E6;border:1px solid #D9B4AC;color:var(--vermelho);border-radius:12px;
 padding:9px 12px;font-size:13.5px;font-weight:600;margin-top:12px;}

.somBtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:60;
 padding:10px 15px;border-radius:30px;border:2px solid var(--verde);background:var(--card);
 color:var(--verde);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
 box-shadow:0 4px 14px rgba(52,37,29,.2);}
.somBtn.mute{border-color:var(--ink2);color:var(--ink2);}

.notifBtn{position:fixed;right:12px;bottom:calc(62px + env(safe-area-inset-bottom));z-index:60;
 padding:10px 15px;border-radius:30px;border:2px solid var(--gold);background:var(--card);
 color:var(--gold);font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
 box-shadow:0 4px 14px rgba(52,37,29,.2);}
</style>
</head>
<body>
<div class="wrap">

<h1>Cozinha</h1>
<div class="sub">Pedidos confirmados, por ordem de hora.</div>
<div class="hoje" id="hoje"></div>

<div class="box" id="loginBox">
  <div style="font-size:13px;letter-spacing:2px;font-weight:600;color:#8B5E3C;margin-bottom:8px;">CHAVE</div>
  <input class="fld" id="fKey" type="password" placeholder="Chave da cozinha" autocomplete="off">
  <button class="btn" onclick="entrar()">Entrar</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="painel" style="display:none">
  <div class="abas">
    <button class="abab sel" id="abPed" onclick="verSeccao('ped')">Pedidos</button>
    <button class="abab" id="abStk" onclick="verSeccao('stk')">Stock</button>
  </div>

  <div id="secPed">
  <div class="filtros">
    <button class="fb sel" id="f1" onclick="filtrar('activos')">A fazer</button>
    <button class="fb" id="f2" onclick="filtrar('pronto')">Prontos</button>
    <button class="fb" id="f3" onclick="filtrar('todos')">Todos</button>
  </div>
  <div id="lista" class="grid"></div>
  </div>

  <div id="secStk" style="display:none">
    <div class="avisoStk">
      Toque em <b>−1</b> sempre que vender. Quando chegar a <b>0</b>,
      o produto deixa de aparecer no site.
    </div>
    <div id="stockLista"></div>
  </div>
</div>

</div>

<script>
/* Substitua pelo URL do seu Worker (o mesmo do menu). */
const PROMO_API="https://wispy-cherry-ee2e.joaomleal88.workers.dev";

const ESTADOS={confirmado:"A aguardar",preparar:"Em preparação",pronto:"Pronto",entregue:"Entregue"};
let KEY="", pedidos=[], filtro="activos";
const $=id=>document.getElementById(id);

$("hoje").textContent=new Date().toLocaleDateString("pt-PT",
 {weekday:"long",day:"2-digit",month:"long"}).toUpperCase();

async function entrar(){
 KEY=$("fKey").value.trim();
 if(!KEY){ $("loginMsg").className="msg bad"; $("loginMsg").textContent="Escreva a chave."; return; }
 $("loginMsg").textContent="A verificar…"; $("loginMsg").className="msg";
 try{
  const r=await fetch(PROMO_API+"/orders?key="+encodeURIComponent(KEY));
  const d=await r.json();
  if(d.erro){ $("loginMsg").className="msg bad"; $("loginMsg").textContent=d.erro; return; }
  pedidos=d.pedidos||[];
 }catch(e){ $("loginMsg").className="msg bad"; $("loginMsg").textContent="Sem ligação ao servidor."; return; }
 $("loginBox").style.display="none";
 $("painel").style.display="block";
 desenhar();
 manterEcraAceso();
 botaoNotificacoes();
 try{ if(localStorage.getItem("ep_som")==="0") alternarAlerta(); }catch(e){}
 setInterval(carregar, 20000);          // actualiza sozinho
}

async function carregar(){
 try{
  const r=await fetch(PROMO_API+"/orders?key="+encodeURIComponent(KEY));
  const d=await r.json();
  if(!d.erro) pedidos=d.pedidos||[];
  verificarNovos(pedidos);
 }catch(e){}
 desenhar();
}

function filtrar(f){
 filtro=f;
 [["activos","f1"],["pronto","f2"],["todos","f3"]].forEach(([k,id])=>
  $(id).classList.toggle("sel", k===f));
 desenhar();
}

function atrasado(slot){
 if(!slot) return false;
 const [h,m]=slot.split(":").map(Number);
 const n=new Date();
 return (h*60+m) < (n.getHours()*60+n.getMinutes());
}

function desenhar(){
 let l=pedidos;
 if(filtro==="activos") l=l.filter(p=>p.status==="confirmado"||p.status==="preparar");
 else if(filtro==="pronto") l=l.filter(p=>p.status==="pronto");
 if(!l.length){ $("lista").innerHTML='<div class="vazio">Nada por aqui.</div>'; return; }
 $("lista").innerHTML=l.map(p=>{
  const ent=p.modo==="entrega";
  let acts="";
  if(p.status==="confirmado") acts=`<button class="bnx" onclick="mudar('${p.id}','preparar')">Começar</button>`;
  else if(p.status==="preparar") acts=`<button class="bok" onclick="mudar('${p.id}','pronto')">Pronto</button>`;
  else if(p.status==="pronto") acts=`<button class="bok" onclick="mudar('${p.id}','entregue')">${ent?"Saiu":"Levantado"}</button>`;
  const atr=(p.status!=="entregue"&&atrasado(p.slot));
  return `<div class="ped ${p.status}">
   <div class="top"><span class="hora">${p.slot||"—"}</span>
    <span class="tipo ${ent?"ent":""}">${ent?"ENTREGA":"LEVANTAR"}</span></div>
   <div class="cli"><b>${p.nome||"(sem nome)"}</b>${p.tel?` · <a class="tel" href="tel:${p.tel.replace(/\s/g,"")}">${p.tel}</a>`:""}</div>
   <div class="meta">${p.code||""}${p.quando&&p.quando!=="hoje"?" · <b>"+p.quando+"</b>":""}${p.criado?" · pedido às "+p.criado:""}</div>
   <ul>${p.itens.map(i=>`<li>${i}</li>`).join("")}</ul>
   ${p.morada?`<div class="mor">📍 ${p.morada}</div>`:""}
   ${p.notas?`<div class="nt">⚠ ${p.notas}</div>`:""}
   ${atr?`<div class="atr">Hora ultrapassada</div>`:""}
   <div class="est">${(ESTADOS[p.status]||p.status).toUpperCase()}</div>
   <div class="acts">${acts}</div>
  </div>`;
 }).join("");
}

async function mudar(id,st){
 try{
  const r=await fetch(PROMO_API+"/order-status?key="+encodeURIComponent(KEY)+"&id="+id+"&st="+st,{method:"POST"});
  const d=await r.json();
  if(d.erro){ alert(d.erro); return; }
 }catch(e){ alert("Não foi possível guardar. Verifique a ligação."); return; }
 carregar();
}

/* ================= APP: alerta, vibração, ecrã aceso ================= */
let _idsVistos = null, _alertaLigado = true, _wakeLock = null;

/* Som gerado no próprio telemóvel — não precisa de ficheiro externo.
   Duas notas suaves, tipo campainha de balcão. */
let _audioCtx = null;
function tocarAlerta(){
  if(!_alertaLigado) return;
  try{
    _audioCtx = _audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state === "suspended") _audioCtx.resume();
    [0, 0.18].forEach((atraso, i) => {
      const o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = i === 0 ? 880 : 1170;
      const t = _audioCtx.currentTime + atraso;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.32, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.connect(g); g.connect(_audioCtx.destination);
      o.start(t); o.stop(t + 0.6);
    });
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([220,90,220]); }catch(e){}
}

/* Toca só quando aparece um pedido que ainda não tinha sido visto */
function verificarNovos(lista){
  const ids = (lista||[]).map(p => p.id);
  if(_idsVistos === null){ _idsVistos = new Set(ids); return 0; }  // 1.ª carga: não alerta
  let novos = 0;
  ids.forEach(id => { if(!_idsVistos.has(id)){ novos++; _idsVistos.add(id); } });
  if(novos > 0){
    tocarAlerta();
    const t = document.title.replace(/^\(\d+\)\s*/, "");
    document.title = "(" + novos + ") " + t;
    setTimeout(() => { document.title = t; }, 8000);
  }
  return novos;
}

/* Botão de som + desbloqueio do áudio (os browsers exigem um toque) */
function alternarAlerta(){
  _alertaLigado = !_alertaLigado;
  const b = document.getElementById("somBtn");
  if(b){
    b.textContent = _alertaLigado ? "🔔 Som ligado" : "🔕 Som desligado";
    b.classList.toggle("mute", !_alertaLigado);
  }
  if(_alertaLigado) tocarAlerta();          // confirma que funciona
  try{ localStorage.setItem("ep_som", _alertaLigado ? "1" : "0"); }catch(e){}
}

/* Manter o ecrã aceso — essencial na cozinha */
async function manterEcraAceso(){
  try{
    if("wakeLock" in navigator){
      _wakeLock = await navigator.wakeLock.request("screen");
      document.addEventListener("visibilitychange", async () => {
        if(document.visibilityState === "visible" && "wakeLock" in navigator){
          try{ _wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
        }
      });
    }
  }catch(e){}
}

/* Registar o service worker (é o que torna a página instalável) */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}



/* ---------- STOCK DO DIA ---------- */
const MENU_STK = [["BEBIDAS QUENTES", [{"n": "Espresso", "m": 85}, {"n": "Espresso Duplo", "m": 150}, {"n": "Americano", "m": 120, "g": 150}, {"n": "Cappuccino", "m": 140, "g": 180}, {"n": "Latte Clássico", "m": 130, "g": 170, "d": "meia de leite"}, {"n": "Mocha Chocolate", "m": 170, "g": 190}, {"n": "Caramelo Latte", "m": 180, "g": 200}]], ["MATCHA & COCO", [{"n": "Iced Matcha Latte", "m": 400, "g": 450}, {"n": "Matcha Crème Frappuccino", "m": 450, "g": 500}, {"n": "Raw Coconut Latte", "m": 450, "g": 500}, {"n": "Iced Caramel Macchiato", "m": 450, "g": 500, "d": "com leite de coco"}]], ["BEBIDAS FRIAS", [{"n": "Iced Latte", "m": 175, "g": 200}, {"n": "Iced Caramelo Latte", "m": 275, "g": 300}, {"n": "Café Instantâneo Gelado", "m": 225, "g": 250}, {"n": "Frape Chocolate", "m": 275, "g": 300}, {"n": "Frape Caramelo", "m": 300, "g": 325}, {"n": "Frape Clássico", "m": 225, "g": 250}, {"n": "Iced Mocha", "m": 275, "g": 300}]], ["SUMOS NATURAIS", [{"n": "Sumo de Laranja", "m": 350}, {"n": "Sumo de Manga", "m": 450}, {"n": "Sumo de Papaia", "m": 350}, {"n": "Sumo de Ananás", "m": 500}, {"n": "Sumo de Maçã", "m": 350}]], ["DONUTS & MUFFINS", [{"n": "Donut Chocolate", "m": 135}, {"n": "Donut Doce de Leite", "m": 120}, {"n": "Muffin Chocolate", "m": 100}, {"n": "Muffin Laranja", "m": 95}]], ["MERENDA & PÃO RECHEADO", [{"n": "Merenda Mista", "m": 150, "d": "fiambre, queijo"}, {"n": "Merenda de Chouriço", "m": 140, "d": "chouriço, queijo"}, {"n": "Pão Rech. Frango", "m": 190, "d": "rúcula, queijo, tomate"}, {"n": "Pão Rech. Atum", "m": 190, "d": "queijo, tomate"}, {"n": "Pão Rech. Caprese", "m": 180, "d": "queijo, tomate, molho pesto"}]], ["TOSTAS & WRAPS", [{"n": "Tosta Mista", "m": 180}, {"n": "Tosta Fiambre", "m": 160}, {"n": "Tosta Queijo", "m": 160}, {"n": "Tosta com Manteiga", "m": 120}, {"n": "Wrap de Frango", "m": 400}, {"n": "Wrap de Atum", "m": 400}]], ["ALMOÇO", [{"n": "Salada Fria de Frango", "m": 420, "d": "massa espiral, legumes, molho leve"}, {"n": "Salada Fria de Atum", "m": 420, "d": "massa espiral, legumes, molho leve"}, {"n": "Sopa do Dia", "m": 300, "d": "pergunte a opção!"}, {"n": "Poke Bowl Frango", "m": 600}, {"n": "Poke Bowl Atum", "m": 700}, {"n": "Poke Bowl Salmão", "m": 700}]]];
const CAT_COMIDA = ["DONUTS & MUFFINS","MERENDA & PÃO RECHEADO","TOSTAS & WRAPS","ALMOÇO"];
let stock = {}, fora = [];

function ehComida(cat){
  const n = String(cat||"").replace(/&amp;/g,"&").trim().toUpperCase();
  return CAT_COMIDA.includes(n);
}

function verSeccao(q){
  const p = (q === "ped");
  document.getElementById("secPed").style.display = p ? "block" : "none";
  document.getElementById("secStk").style.display = p ? "none" : "block";
  document.getElementById("abPed").classList.toggle("sel", p);
  document.getElementById("abStk").classList.toggle("sel", !p);
  if(!p) carregarStock();
}

async function carregarStock(){
  try{
    const [r1, r2] = await Promise.all([
      fetch(PROMO_API + "/stock-dia").then(r => r.json()).catch(() => ({})),
      fetch(PROMO_API + "/soldout").then(r => r.json()).catch(() => ({}))
    ]);
    stock = r1.itens || {};
    fora  = r2.itens || [];
  }catch(e){}
  desenharStock();
}

function desenharStock(){
  let h = "";
  MENU_STK.forEach(([cat, itens], ci) => {
    if(!ehComida(cat)) return;
    h += `<div class="scat">${cat}</div>`;
    itens.forEach((it, ii) => {
      const q = stock[it.n];
      const temStock = (q !== undefined);
      const zero = temStock && q <= 0;
      const marcado = fora.includes(it.n);
      const inactivo = zero || marcado;
      h += `<div class="srow${inactivo ? " zero" : ""}">
        <div class="sn">${it.n}${!temStock ? '<div class="semstk">sem stock definido hoje</div>' : ""}</div>
        ${temStock ? `<div class="sq">${q}</div>
          <button class="sminus" onclick="baixar(${ci},${ii})" ${zero ? "disabled" : ""}>−1</button>` : ""}
        <button class="stog ${marcado ? "no" : "on"}" onclick="alternarItem(${ci},${ii})">${marcado ? "ACABOU" : "TEM"}</button>
      </div>`;
    });
  });
  document.getElementById("stockLista").innerHTML = h;
}

/* Vendeu um: baixa imediata no ecrã, confirmação no servidor a seguir */
async function baixar(ci, ii){
  const nome = MENU_STK[ci][1][ii].n;
  if(stock[nome] === undefined || stock[nome] <= 0) return;
  stock[nome] = stock[nome] - 1;      // resposta imediata para quem está a servir
  desenharStock();
  try{ if(navigator.vibrate) navigator.vibrate(40); }catch(e){}
  try{
    const r = await fetch(PROMO_API + "/stock-baixa?key=" + encodeURIComponent(KEY) +
                          "&item=" + encodeURIComponent(nome), {method:"POST"});
    const d = await r.json();
    if(d.erro){ alert(d.erro); carregarStock(); return; }
    stock = d.itens || stock;         // o servidor manda
    desenharStock();
  }catch(e){
    alert("Sem ligação — a baixa não foi guardada.");
    carregarStock();
  }
}

async function alternarItem(ci, ii){
  const nome = MENU_STK[ci][1][ii].n;
  const marcado = fora.includes(nome);
  try{
    const r = await fetch(PROMO_API + "/soldout-set?key=" + encodeURIComponent(KEY) +
                          "&item=" + encodeURIComponent(nome) + "&on=" + (marcado ? "0" : "1"),
                          {method:"POST"});
    const d = await r.json();
    if(d.erro){ alert(d.erro); return; }
    fora = d.itens || [];
    desenharStock();
  }catch(e){ alert("Não foi possível guardar."); }
}

/* ============ REGISTAR ESTE TELEMÓVEL PARA NOTIFICAÇÕES ============ */
function b64uParaU8(s){
  s = s.replace(/-/g,"+").replace(/_/g,"/");
  while(s.length % 4) s += "=";
  const bin = atob(s), a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return a;
}

async function activarNotificacoes(){
  const btn = document.getElementById("notifBtn");
  const dizer = (txt, cor) => { if(btn){ btn.textContent = txt; btn.style.borderColor = cor||""; btn.style.color = cor||""; } };

  if(!("Notification" in window) || !("serviceWorker" in navigator) || !("PushManager" in window)){
    alert("Este telemóvel/browser não suporta notificações.\n\nNo Android use o Chrome. No iPhone, instale primeiro a app no ecrã principal (Partilhar → Adicionar ao Ecrã Principal).");
    return;
  }
  try{
    const permissao = await Notification.requestPermission();
    if(permissao !== "granted"){
      alert("Não autorizou as notificações.\n\nPara activar: definições do telemóvel → Apps → esta app → Notificações.");
      dizer("🔔 Activar notificações");
      return;
    }
    // se o service worker não estiver pronto, não ficamos à espera para sempre
    const reg = await Promise.race([
      navigator.serviceWorker.ready,
      new Promise((_, rej) => setTimeout(() => rej(new Error(
        "O service worker não está activo.\n\nConfirme que o ficheiro sw.js foi carregado nesta pasta do site, feche a app por completo e volte a abrir."
      )), 6000))
    ]);
    const r = await fetch(PROMO_API + "/push-chave");
    const d = await r.json();
    if(!d.chave){ alert("Não foi possível obter a chave do servidor."); return; }

    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: b64uParaU8(d.chave)
      });
    }
    const g = await fetch(PROMO_API + "/push-sub?key=" + encodeURIComponent(KEY), {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ endpoint: sub.endpoint })
    });
    const res = await g.json();
    if(res.erro){ alert(res.erro); return; }
    dizer("✅ Notificações activas", "#2E6B32");
    try{ localStorage.setItem("ep_push","1"); }catch(e){}
    setTimeout(()=>dizer("🔔 Testar notificação"), 2500);
  }catch(e){
    alert("Não foi possível activar: " + (e && e.message ? e.message : e));
  }
}

async function testarNotificacao(){
  try{
    // TESTE 1 — notificação local, mostrada pelo próprio telemóvel.
    // Se esta não aparecer, o bloqueio está nas definições do telemóvel.
    try{
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification("Teste local", {
        body: "Se vê isto, o telemóvel mostra notificações.",
        icon: "icon-192.png", tag: "teste-local",
        silent: false, renotify: true,
        vibrate: [300,120,300,120,300]
      });
    }catch(e){
      alert("O telemóvel recusou mostrar a notificação:\n\n" + e +
            "\n\nVá a Definições → Aplicações → esta app → Notificações e active.");
      return;
    }
    // TESTE 2 — notificação enviada pelo servidor (o caminho real)
    const r = await fetch(PROMO_API + "/push-teste?key=" + encodeURIComponent(KEY), {method:"POST"});
    const d = await r.json();
    if(d.erro){ alert(d.erro); return; }
    if(!d.aparelhos){
      alert("Nenhum aparelho registado.\n\nToque em «Activar notificações» primeiro.");
      return;
    }
    const linhas = (d.resultado||[]).map(x =>
      "• " + (x.estado===201||x.estado===200 ? "ENVIADO (" + x.estado + ")" : "FALHOU: " + x.estado)
      + (x.resposta ? "\n  " + x.resposta : "")
    ).join("\n");
    alert("Aparelhos registados: " + d.aparelhos + "\n\n" + linhas +
      "\n\nDeve ter recebido DUAS notificações:\n" +
      "1) «Teste local» — mostrada pelo telemóvel\n" +
      "2) «Novo pedido» — enviada pelo servidor\n\n" +
      "Se só veio a 1.ª, o envio chega mas o Android está a bloquear em segundo plano " +
      "(Definições → Aplicações → esta app → Bateria → Sem restrições).");
  }catch(e){ alert("Falhou o teste: " + e); }
}

function tocarNotifBtn(){
  if(typeof KEY === "undefined" || !KEY){
    alert("Entre com a chave primeiro.");
    return;
  }
  let jaActivo = false;
  try{ jaActivo = localStorage.getItem("ep_push")==="1" && Notification.permission==="granted"; }catch(e){}
  if(jaActivo) testarNotificacao(); else activarNotificacoes();
}

function botaoNotificacoes(){
  const btn = document.getElementById("notifBtn");
  if(!btn) return;
  let jaActivo = false;
  try{ jaActivo = localStorage.getItem("ep_push")==="1" && Notification.permission==="granted"; }catch(e){}
  btn.textContent = jaActivo ? "🔔 Testar notificação" : "🔔 Activar notificações";
}

<button class="notifBtn" id="notifBtn" onclick="tocarNotifBtn()">🔔 Activar notificações</button>
