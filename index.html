@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Jost:wght@300;400;500;600&family=Caveat:wght@600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--cream:#F7F1E4;--card:#FFFCF6;--line:#E7DCC8;--dot:#CBB693;--ink:#34251D;
 --ink2:#785B42;--gold:#B8783D;--dark:#2F2119;--green:#66704A;--green2:#4E5937;--wa:#25D366;}
html{scroll-behavior:smooth;}
body{background:radial-gradient(circle at 7% 4%,rgba(255,255,255,.72),transparent 24%),var(--cream);
 color:var(--ink);font-family:'Jost',system-ui,sans-serif;
 -webkit-text-size-adjust:100%;padding-bottom:96px;}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 24px;}

/* NOVA FRENTE — design público; a lógica de pedidos mantém-se abaixo */
.sitebar{position:sticky;top:0;z-index:65;display:grid;grid-template-columns:auto minmax(300px,1fr) auto auto;
 align-items:center;gap:22px;min-height:76px;padding:10px 14px;margin-bottom:12px;
 background:rgba(255,252,246,.94);border:1px solid rgba(184,120,61,.18);border-radius:0 0 18px 18px;
 box-shadow:0 8px 28px rgba(52,37,29,.08);backdrop-filter:blur(14px);}
.brand-lockup{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;white-space:nowrap;}
.brand-lockup img{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff;}
.brand-lockup strong{font-family:'Playfair Display',serif;font-size:21px;letter-spacing:1.1px;}
.brand-lockup small{display:block;margin-top:2px;color:var(--ink2);font-size:9px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;}
.desktop-nav{display:flex;justify-content:center;gap:22px;}
.desktop-nav a{position:relative;color:var(--ink);font-size:12.5px;font-weight:600;letter-spacing:.5px;
 text-decoration:none;white-space:nowrap;}
.desktop-nav a:after{content:"";position:absolute;left:0;right:100%;bottom:-7px;height:2px;background:var(--gold);transition:right .2s ease;}
.desktop-nav a:hover:after{right:0;}
.site-meta{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:11px;font-weight:600;
 letter-spacing:.8px;text-transform:uppercase;white-space:nowrap;}
.topcart{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;
 padding:13px 18px;background:var(--green2);color:#fff;font:600 12px/1 'Jost',sans-serif;
 letter-spacing:.7px;text-transform:uppercase;cursor:pointer;white-space:nowrap;}
.topcart #topCnt{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;
 border-radius:20px;background:#F3D5B3;color:var(--dark);font-size:12px;}

.home-hero{position:relative;isolation:isolate;min-height:480px;display:flex;align-items:center;overflow:hidden;
 border-radius:25px;padding:54px 46px;box-shadow:0 20px 48px rgba(52,37,29,.13);background:#F7F1E4;}
.hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;
 opacity:0;transition:opacity 1.4s ease-in-out;z-index:-2;}
.hero-slide.on{opacity:1;}
.home-hero::after{content:"";position:absolute;inset:0;z-index:-1;
 background:linear-gradient(90deg,rgba(247,241,228,.99) 0%,rgba(247,241,228,.95) 36%,rgba(247,241,228,.18) 66%,rgba(247,241,228,0) 100%);}
@media(max-width:760px){
 .home-hero{padding:32px 22px 26px;min-height:auto;}
 .hero-slide{background-position:72% center;}
 .home-hero::after{background:linear-gradient(180deg,rgba(247,241,228,.96) 0%,rgba(247,241,228,.88) 38%,rgba(247,241,228,.55) 70%,rgba(247,241,228,.30) 100%);}
 .home-hero h1{font-size:clamp(32px,8.6vw,42px);line-height:1.08;}
 .home-hero p{font-size:15.5px;}
 .home-facts{gap:7px;}
 .home-facts span{font-size:12px;}
}
.home-hero:before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 8% 16%,rgba(255,255,255,.72),transparent 33%);}
.home-copy{max-width:610px;}
.home-kicker{display:inline-flex;align-items:center;gap:9px;margin-bottom:14px;color:var(--ink2);
 font-size:11.5px;font-weight:600;letter-spacing:3px;text-transform:uppercase;}
.home-kicker:before{content:"";width:36px;height:1px;background:var(--gold);}
.home-copy h1{font-family:'Playfair Display',serif;font-size:clamp(42px,5.5vw,68px);font-weight:700;
 line-height:1.02;letter-spacing:-1.7px;max-width:650px;}
.home-copy>p{max-width:550px;margin-top:19px;color:#6E4B2F;font-size:clamp(15px,1.7vw,19px);line-height:1.55;}
.home-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px;}
.home-btn{display:inline-flex;align-items:center;justify-content:center;min-width:145px;padding:14px 22px;
 border-radius:12px;border:1.5px solid var(--dark);font-size:12px;font-weight:600;letter-spacing:1px;
 text-transform:uppercase;text-decoration:none;cursor:pointer;font-family:inherit;}
.home-btn.primary{background:var(--dark);color:#fff;}
.home-btn.secondary{background:rgba(255,252,246,.84);color:var(--dark);}
.home-facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px;}
.home-facts span{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:9px;
 background:rgba(255,252,246,.88);border:1px solid rgba(184,120,61,.29);font-size:10px;
 font-weight:600;letter-spacing:.45px;text-transform:uppercase;}

.category-strip{position:relative;z-index:3;display:flex;align-items:center;gap:5px;width:calc(100% - 70px);
 margin:-25px auto 34px;padding:8px 10px;overflow-x:auto;background:rgba(255,252,246,.98);
 border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 24px rgba(52,37,29,.09);scrollbar-width:none;}
.category-strip::-webkit-scrollbar{display:none;}
.category-strip button{flex:1;min-width:max-content;border:0;border-radius:12px;background:transparent;color:var(--ink);
 padding:11px 13px;font:600 11px/1 'Jost',sans-serif;letter-spacing:.7px;text-transform:uppercase;cursor:pointer;}
.category-strip button:first-child{background:var(--dark);color:#fff;}
.category-strip button:hover{background:#EFE4D0;}
.category-strip button:first-child:hover{background:var(--dark);}

.section-heading{text-align:center;margin:0 auto 18px;max-width:720px;}
.section-heading .eyebrow{display:block;color:var(--gold);font-size:10.5px;font-weight:600;letter-spacing:2.7px;text-transform:uppercase;}
.section-heading h2{font-family:'Playfair Display',serif;font-size:clamp(31px,4vw,45px);font-weight:700;margin-top:5px;}
.section-heading h2:after{content:"";display:block;width:64px;height:2px;margin:9px auto 0;background:var(--gold);}
.section-heading p{margin-top:10px;color:var(--ink2);font-size:14px;line-height:1.55;}
.best-section{margin:0 0 42px;scroll-margin-top:96px;}
.best-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
.best-card{min-width:0;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:16px;
 box-shadow:0 8px 20px rgba(52,37,29,.07);transition:transform .2s ease,box-shadow .2s ease;}
.best-card:hover{transform:translateY(-3px);box-shadow:0 13px 28px rgba(52,37,29,.12);}
.best-card.blocked{opacity:.55;}
.best-media{position:relative;display:block;width:100%;padding:0;border:0;background:#EDE2D0;cursor:pointer;}
.best-media>img:first-child{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;}
.best-logo{position:absolute;left:10px;bottom:10px;width:38px;height:38px!important;aspect-ratio:1!important;
 border-radius:50%;object-fit:cover!important;border:2px solid rgba(255,255,255,.92);box-shadow:0 3px 9px rgba(47,33,25,.25);}
.best-info{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:8px;align-items:end;padding:12px;}
.best-name{font-size:14px;font-weight:600;line-height:1.22;min-height:35px;}
.best-price{margin-top:5px;color:#986333;font-size:13.5px;font-weight:600;}
.best-price span{color:#B99874;font-weight:400;}
.best-add{width:38px;height:38px;border:0;border-radius:50%;background:var(--green2);color:#fff;
 font-size:23px;line-height:1;cursor:pointer;font-family:inherit;}
.best-add:active{transform:scale(.93);}
.best-add[disabled]{cursor:not-allowed;background:#9A8E80;}
.best-status{display:block;margin-top:3px;color:#9D3232;font-size:11px;}

.menu-intro{margin:8px 0 18px;scroll-margin-top:96px;}
.order-panel{margin:0 0 22px;padding:22px;border:1px solid var(--line);border-radius:20px;
 background:linear-gradient(135deg,#FFFCF6,#EFE4D0);box-shadow:0 10px 24px rgba(52,37,29,.06);scroll-margin-top:96px;}
.order-panel>img.logo,.order-panel>h1,.order-panel>.tag,.order-panel>.rule,.order-panel>.mt,.order-panel>.loc{display:none;}
.order-panel-title{text-align:center;margin-bottom:12px;}
.order-panel-title span{color:var(--gold);font-size:10.5px;font-weight:600;letter-spacing:2.4px;text-transform:uppercase;}
.order-panel-title h2{font-family:'Playfair Display',serif;font-size:27px;margin-top:2px;}
.order-panel .cta{max-width:560px;margin:0 auto 16px;}
.order-panel .passos{max-width:760px;margin:0 auto;}
.order-panel .actions{margin-top:14px;}
.order-panel .modebox{max-width:760px;margin:16px auto 0;}
.order-panel .hint{max-width:760px;margin:14px auto 0;}
.order-panel .again{max-width:760px;margin-left:auto;margin-right:auto;}
.order-panel+section.hero{display:none;}

.brand-story{display:grid;grid-template-columns:1.05fr .95fr;gap:0;overflow:hidden;margin:24px 0;
 border:1px solid var(--line);border-radius:22px;background:var(--card);box-shadow:0 12px 30px rgba(52,37,29,.07);scroll-margin-top:96px;}
.story-photos{display:grid;grid-template-columns:1fr 1fr;min-height:330px;}
.story-photos img{width:100%;height:100%;object-fit:cover;}
.story-photos img:first-child{grid-row:1/3;}
.story-copy{display:flex;flex-direction:column;justify-content:center;padding:44px;}
.story-copy .eyebrow{color:var(--gold);font-size:10.5px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;}
.story-copy h2{font-family:'Playfair Display',serif;font-size:clamp(29px,3.3vw,42px);line-height:1.08;margin-top:8px;}
.story-copy p{color:var(--ink2);font-size:14.5px;line-height:1.65;margin-top:15px;}
.story-copy a{align-self:flex-start;margin-top:20px;color:var(--green2);font-weight:600;text-underline-offset:5px;}

.site-footer{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:28px;margin-top:20px;padding:30px;
 background:var(--dark);color:#F7F1E4;border-radius:22px 22px 10px 10px;}
.footer-brand{display:flex;gap:14px;align-items:center;}
.footer-brand img{width:72px;height:72px;border-radius:50%;border:2px solid var(--gold);object-fit:cover;background:#fff;}
.footer-brand strong{display:block;font-family:'Playfair Display',serif;font-size:21px;}
.footer-brand p{display:block;margin-top:3px;color:#D9C7A8;font-size:12.5px;}
.footer-col b{display:block;color:var(--gold);font-family:'Playfair Display',serif;font-size:16px;margin-bottom:8px;}
.footer-col span,.footer-col a{display:block;color:#D9C7A8;font-size:13px;line-height:1.7;text-decoration:none;}
.footer-bottom{grid-column:1/-1;border-top:1px solid #5A4636;margin-top:4px;padding-top:13px;
 color:#BCA991;font-size:11.5px;text-align:center;}
.site-footer{text-align:left;font-size:initial;font-weight:400;}

@media(max-width:1020px){
 .sitebar{grid-template-columns:auto 1fr auto;gap:14px;}
 .site-meta{display:none;}
 .desktop-nav{justify-content:flex-end;gap:16px;}
 .home-hero{min-height:455px;padding:44px 38px;}
 .best-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
 .best-card:nth-child(n+4){margin-top:2px;}
}
@media(max-width:719px){
 .wrap{padding:8px 10px 18px;}
 .sitebar{grid-template-columns:1fr auto;gap:8px;min-height:66px;padding:8px 10px;margin-bottom:8px;}
 .brand-lockup{gap:8px;}.brand-lockup img{width:44px;height:44px;}.brand-lockup strong{font-size:16.5px;letter-spacing:.6px;}
 .desktop-nav,.site-meta{display:none;}.topcart{padding:11px 12px;gap:5px;}.topcart-label{display:none;}
 .home-hero{min-height:525px;align-items:flex-start;padding:25px 18px;background-position:68% center;}
 .home-copy{max-width:100%;padding:4px;}.home-copy h1{max-width:390px;font-size:clamp(36px,11vw,49px);letter-spacing:-1px;}
 .home-copy>p{max-width:360px;font-size:15px;margin-top:12px;}.home-actions{margin-top:17px;}
 .home-btn{min-width:126px;padding:12px 15px;font-size:11px;}.home-facts{margin-top:15px;gap:6px;}
 .home-facts span{padding:7px 9px;font-size:9px;}.category-strip{width:calc(100% - 14px);margin:-18px auto 27px;}
 .category-strip button{flex:0 0 auto;}.section-heading p{padding:0 14px;}
 .best-grid{display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(220px,78vw);
  gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 2px 14px;scrollbar-width:none;}
 .best-grid::-webkit-scrollbar{display:none;}.best-card{scroll-snap-align:start;}.best-card:nth-child(n+4){margin-top:0;}
 .order-panel{padding:16px 12px;}.brand-story{grid-template-columns:1fr;}.story-photos{min-height:260px;}
 .story-copy{padding:28px 22px;}.site-footer{grid-template-columns:1fr;padding:24px 20px;gap:20px;}
 .footer-bottom{grid-column:1;}
}

header{text-align:center;}
header img.logo{width:100px;height:100px;border-radius:50%;border:3px solid var(--gold);object-fit:cover;background:#fff;}
header h1{font-family:'Playfair Display',serif;font-size:clamp(29px,7.5vw,48px);letter-spacing:3px;margin-top:12px;line-height:1.05;}
header .tag{font-family:'Caveat',cursive;font-size:clamp(19px,4.8vw,28px);color:#8B5E3C;margin-top:2px;}
header .rule{width:150px;height:3px;background:var(--gold);margin:12px auto 8px;border-radius:2px;}
header .mt{font-size:clamp(14px,3.8vw,20px);letter-spacing:8px;font-weight:600;}
header .loc{font-size:14px;color:#6E4B2F;margin-top:8px;line-height:1.6;}
.actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:16px 0 2px;}
.btn{display:inline-flex;align-items:center;gap:7px;padding:12px 18px;border-radius:40px;
 font-size:15px;font-weight:600;text-decoration:none;border:2px solid var(--dark);cursor:pointer;font-family:inherit;}
.btn-p{background:var(--dark);color:#F7F1E4;}
.btn-s{background:transparent;color:var(--dark);}
.cta{display:block;background:var(--dark);color:#F7F1E4;border-radius:18px;
 padding:17px 18px;margin-top:18px;text-decoration:none;text-align:center;

.cta .ctat{display:block;font-family:'Playfair Display',serif;font-size:23px;font-weight:800;}
.cta .ctas{display:block;font-size:14px;color:#D9C7A8;font-weight:300;margin-top:4px;line-height:1.45;}
.cta .ctas b{color:var(--gold);font-weight:600;}
.passos{margin-top:14px;}
.passos .pl{font-size:11.5px;letter-spacing:2.5px;font-weight:600;color:#8B5E3C;margin-bottom:8px;}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
@media(min-width:700px){.pgrid{grid-template-columns:repeat(4,1fr);}}
.pas.pay{background:#1F4A38;border-color:#1F4A38;box-shadow:0 4px 12px rgba(31,74,56,.22);}
.pas.pay b{color:#E4C79A;}
.pas.pay span{color:#EFE7D8;font-weight:500;}
.pas{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 7px;text-align:center;}
.pas b{display:block;font-family:'Playfair Display',serif;font-size:19px;color:var(--gold);}
.pas span{display:block;font-size:12.5px;line-height:1.35;color:var(--ink2);margin-top:3px;}
.lig2{display:inline-block;margin-top:12px;font-size:14px;color:var(--ink2);
 text-decoration:underline;text-underline-offset:3px;}
.hint{background:#FFF6E2;border:1px solid var(--gold);border-radius:14px;
 padding:11px 14px;font-size:14px;color:#6E4B2F;text-align:center;margin-top:16px;line-height:1.55;}

.hero{background:var(--green);border-radius:20px;padding:20px 14px 16px;margin:20px 0;}
.hero h2{font-family:'Caveat',cursive;font-size:clamp(32px,8.5vw,50px);color:#F7F1E4;text-align:center;line-height:1;}
.hero .sub{text-align:center;font-size:12px;letter-spacing:3px;color:#B9CE8F;font-weight:600;margin-top:4px;}
.hgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:14px;}
.hcell{background:#2E4023;border-radius:14px;overflow:hidden;}
.hcell img{width:100%;height:150px;object-fit:cover;display:block;}

.cards{display:grid;grid-template-columns:1fr;gap:18px;scroll-margin-top:96px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
 scroll-margin-top:96px;box-shadow:0 7px 18px rgba(52,37,29,.045);}
.card img.banner{width:100%;height:145px;object-fit:cover;display:block;}
.card .in{padding:15px 15px 16px;}
.ribbon .cat-ico{width:19px;height:19px;flex:none;color:var(--gold);}
.ribbon{display:inline-flex;align-items:center;gap:9px;background:var(--dark);color:#F7F1E4;font-weight:600;font-size:15.5px;
 letter-spacing:2px;padding:7px 17px;border-radius:6px 16px 6px 16px;margin-bottom:6px;}
.sizes{display:flex;justify-content:flex-end;font-size:11.5px;letter-spacing:2px;color:#8B5E3C;font-weight:600;padding-right:44px;}
.sizes span{width:44px;text-align:right;}

.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dotted var(--dot);}
.it:last-child{border-bottom:none;}
.it .nm{flex:1;font-size:16px;line-height:1.3;}
.it .nm small{display:block;font-size:13px;color:var(--ink2);font-weight:300;margin-top:1px;}
.it .pr{font-weight:600;font-size:15.5px;white-space:nowrap;}
.it .pr em{font-style:normal;color:#8B5E3C;}
.add{width:36px;height:36px;flex:none;border-radius:50%;border:2px solid var(--dark);
 background:var(--dark);color:#F7F1E4;font-size:21px;line-height:1;cursor:pointer;font-family:inherit;}
.add:active{transform:scale(.92);}
.qbadge{width:36px;height:36px;flex:none;border-radius:50%;background:var(--wa);color:#08320F;
 display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;border:none;font-family:inherit;}
.it.blk{opacity:.5;}
.it .only{color:#A33;font-weight:400;}
.noadd{width:36px;height:36px;flex:none;border-radius:50%;border:2px dashed var(--dot);
 display:flex;align-items:center;justify-content:center;color:var(--dot);font-size:15px;}
.again{background:var(--green);border-radius:16px;padding:13px 14px;margin-top:16px;color:#F7F1E4;text-align:left;}
.again .agtop{display:flex;justify-content:space-between;align-items:center;}
.again .aglbl{font-size:11.5px;letter-spacing:2px;font-weight:600;color:#B9CE8F;}
.again .agx{background:transparent;border:none;color:#8FA37A;font-size:16px;cursor:pointer;padding:0 4px;font-family:inherit;}
.again .agtxt{font-size:14.5px;font-weight:300;margin:7px 0 11px;line-height:1.45;}
.again .agbtn{width:100%;padding:12px;border-radius:30px;background:var(--gold);color:var(--dark);
 border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
.avisoent{background:#F6E9E6;border:1px solid #D9B4AC;color:#8C2F2F;border-radius:12px;
 padding:9px 12px;font-size:13.5px;line-height:1.45;margin-bottom:11px;font-weight:500;}
.chip.off,.chip[disabled]{opacity:.38;pointer-events:none;text-decoration:line-through;}
.mapbtn{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:12px 22px;
 border-radius:40px;background:#F7F1E4!important;color:#22160E!important;text-decoration:none!important;
 font-size:15px;font-weight:600;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.18);}
.mapbtn span{color:#22160E!important;}
.mapbtn svg{width:19px;height:19px;color:#1F4A38;flex:none;}
.langs{display:flex;gap:5px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;}
.langs button{padding:5px 12px;border-radius:30px;border:2px solid var(--line);background:var(--card);
 font-size:13px;font-weight:600;letter-spacing:1px;cursor:pointer;font-family:inherit;color:var(--ink2);}
.langs button.sel{background:var(--dark);color:#F7F1E4;border-color:var(--dark);}
.langnote{font-size:12px;color:var(--ink2);text-align:center;line-height:1.5;
 background:var(--card);border:1px solid var(--line);border-radius:12px;
 padding:7px 12px;margin-bottom:12px;font-weight:300;}
.langnote b{font-weight:600;color:var(--ink);}
.fechado{background:#8C2F2F;color:#fff;border-radius:16px;padding:15px 16px;margin-bottom:16px;
 font-size:15px;line-height:1.55;text-align:center;}
.modebox{background:var(--card);border:2px solid var(--gold);border-radius:16px;padding:14px;margin-top:16px;text-align:center;}
.modebox .mlbl{font-size:12.5px;letter-spacing:2px;font-weight:600;color:#8B5E3C;margin-bottom:9px;}
.modebox .chips{justify-content:center;}
.modebox .mnote{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.5;font-weight:300;}
.note{font-size:13px;color:var(--ink2);font-weight:300;margin-top:9px;border-top:1px solid var(--line);padding-top:8px;}

.combos{background:var(--dark);border-radius:18px;padding:18px 14px 8px;margin:18px 0;}
.combos .ribbon{background:var(--gold);color:var(--dark);}
.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:6px;}
.combo{background:#3B2A1E;border-radius:12px;padding:11px 12px;color:#F7F1E4;display:flex;flex-direction:column;}
.combo .cn{font-size:13.5px;font-weight:600;}
.combo .ci{font-size:12px;color:#D9C7A8;font-weight:300;margin-top:2px;flex:1;}
.combo .brow{display:flex;align-items:center;justify-content:space-between;margin-top:7px;gap:6px;}
.combo .cp{font-family:'Playfair Display',serif;font-size:19px;font-weight:800;color:var(--gold);}
.combo.full{grid-column:1/-1;}

.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.mitem{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:8px 3px;text-align:center;}
.mitem b{display:block;font-size:13.5px;}
.mitem span{font-size:12px;color:var(--ink2);}

.info{background:var(--green2);color:#F7F1E4;border-radius:18px;padding:25px 20px;text-align:center;
 box-shadow:0 12px 26px rgba(78,89,55,.2);scroll-margin-top:96px;}
.info .big{font-family:'Playfair Display',serif;font-size:25px;font-weight:800;color:#FFF7E9;}
.info .sm{font-size:14px;color:#E8E2D4;margin-top:6px;font-weight:300;line-height:1.8;}
.info a{color:#FFF7E9;font-weight:600;}
footer{text-align:center;font-size:12px;color:var(--ink2);padding:18px 0 6px;font-weight:300;}

/* BARRA */
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(46,32,24,.98);padding:10px 12px;
 padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;
 box-shadow:0 -3px 16px rgba(0,0,0,.25);z-index:60;}
.bar a,.bar button{flex:1;max-width:300px;text-align:center;padding:13px 8px;border-radius:40px;
 font-size:15px;font-weight:600;text-decoration:none;border:none;cursor:pointer;font-family:inherit;}
.ct .ctot{font-weight:700;opacity:.92;}
.ct .cnt{background:#2A1B10;color:var(--gold);min-width:23px;height:23px;border-radius:20px;
 display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.bar.has .ct{box-shadow:0 0 0 3px rgba(200,155,109,.28);}
@keyframes pulseCt{0%{transform:scale(1)}38%{transform:scale(1.045)}100%{transform:scale(1)}}
.bar .ct.pulse{animation:pulseCt .42s cubic-bezier(.34,1.56,.64,1);}
.musicbtn{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));
 z-index:40;width:46px;height:46px;border-radius:50%;border:2px solid var(--gold);
 background:rgba(251,247,238,.94);color:var(--gold);display:flex;align-items:center;
 justify-content:center;box-shadow:0 4px 14px rgba(52,37,29,.22);cursor:pointer;
 transition:transform .2s;}
.musicbtn svg{width:19px;height:19px;}
.musicbtn.on{background:var(--dark);color:var(--gold);}
.musicbtn.on svg{animation:musicPulse 1.8s ease-in-out infinite;}
@keyframes musicPulse{0%,100%{opacity:1}50%{opacity:.55}}
.bar .cl{background:transparent;color:var(--gold);border:2px solid var(--gold);
 flex:0 0 58px;max-width:58px;font-size:20px;display:flex;align-items:center;justify-content:center;}
.bar .ct{flex:1;max-width:none;}
.bar .ct{background:var(--gold);color:#2A1B10;display:flex;align-items:center;justify-content:center;gap:9px;}
.bar .ct .cnt{background:#08320F;color:#fff;border-radius:20px;padding:1px 8px;font-size:13px;}

/* SHEETS */
.ov{position:fixed;inset:0;background:rgba(20,12,6,.62);z-index:80;display:none;}
.ov.on{display:block;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--cream);z-index:90;
 border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;display:none;
 padding:18px 16px calc(20px + env(safe-area-inset-bottom));}
.sheet.on{display:block;}
.sheet h3{font-family:'Playfair Display',serif;font-size:21px;margin-bottom:3px;}
.sheet .sd{font-size:13.5px;color:var(--ink2);font-weight:300;margin-bottom:14px;}
.grab{width:46px;height:5px;background:var(--dot);border-radius:4px;margin:0 auto 14px;}
.lbl{font-size:13px;letter-spacing:1.5px;font-weight:600;color:#8B5E3C;margin:14px 0 7px;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:10px 15px;border-radius:30px;border:2px solid var(--line);background:var(--card);
 font-size:14.5px;cursor:pointer;font-family:inherit;color:var(--ink);}
.chip.sel{border-color:var(--dark);background:var(--dark);color:#F7F1E4;}
.fld{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);
 font-family:inherit;font-size:16px;color:var(--ink);margin-top:4px;}
.fld:focus{outline:none;border-color:var(--gold);}
textarea.fld{min-height:74px;resize:vertical;}
.go{width:100%;padding:16px;border-radius:40px;background:var(--wa);color:#08320F;font-size:16.5px;
 font-weight:700;border:none;margin-top:18px;cursor:pointer;font-family:inherit;}
.go[disabled]{opacity:.45;}
.gs{width:100%;padding:13px;border-radius:40px;background:transparent;color:var(--dark);
 border:2px solid var(--dark);font-size:15px;font-weight:600;margin-top:9px;cursor:pointer;font-family:inherit;}

.crow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dotted var(--dot);}
.crow .cinfo{flex:1;font-size:15.5px;line-height:1.35;}
.crow .cinfo small{display:block;font-size:12.5px;color:var(--ink2);font-weight:300;}
.qty{display:flex;align-items:center;gap:9px;}
.qty button{width:31px;height:31px;border-radius:50%;border:2px solid var(--dark);background:transparent;
 color:var(--ink);font-size:17px;line-height:1;cursor:pointer;font-family:inherit;}
.qty b{min-width:17px;text-align:center;font-size:15.5px;}
.crow .cp2{font-weight:600;min-width:58px;text-align:right;font-size:15.5px;}
/* carrinho: juntar mais é a acção principal — o "+" vai cheio e um pouco maior, o "−" fica discreto */
.crow .qty{gap:8px;}
.crow .qty button{width:34px;height:34px;border-color:#CDBFA8;color:var(--ink2);font-size:18px;transition:transform .12s ease;}
.crow .qty button.mais{background:var(--roxo);border-color:var(--roxo);color:#FBF4E6;font-size:21px;font-weight:500;
 box-shadow:0 3px 9px rgba(74,37,69,.24);}
.crow .qty button:active{transform:scale(.92);}
.crow .qty b{min-width:19px;font-size:16.5px;font-weight:600;}
.tot{display:flex;justify-content:space-between;padding:8px 0;font-size:15.5px;}
.tot.grand{font-family:'Playfair Display',serif;font-size:22px;font-weight:800;
 border-top:2px solid var(--dark);margin-top:8px;padding-top:12px;}
.empty{text-align:center;padding:26px 10px;color:var(--ink2);font-weight:300;}
.warn{background:#FFF6E2;border:1px solid var(--gold);border-radius:12px;padding:10px 12px;
 font-size:13.5px;color:#6E4B2F;margin-top:12px;line-height:1.5;}
.geo-ok{color:#2E6B32;font-weight:600;}
.promorow{display:flex;gap:8px;align-items:stretch;}
.promorow .fld{flex:1;margin-top:0;text-transform:uppercase;}
.pbtn{padding:0 20px;border-radius:14px;border:2px solid var(--dark);background:var(--dark);
 color:#F7F1E4;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
#promoMsg{font-size:13.5px;margin-top:8px;min-height:4px;}
.pok{color:#2E6B32;font-weight:600;}
.pbad{color:#A33;}
.plink{background:none;border:none;color:var(--ink2);text-decoration:underline;
 font-size:13.5px;cursor:pointer;font-family:inherit;padding:0;}
.paynote{font-size:13.5px;color:var(--ink2);font-weight:300;margin-bottom:9px;line-height:1.5;}
.bankcard{background:var(--dark);color:#F7F1E4;border-radius:14px;padding:14px 16px;margin-top:12px;}
.bankcard .bk{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);font-weight:800;}
.bankcard .ln{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:5px 0;border-bottom:1px dotted #5A4636;}
.bankcard .ln:last-of-type{border-bottom:none;}
.bankcard .ln span:first-child{color:#D9C7A8;font-weight:300;}
.bankcard .ln b{font-family:monospace;font-size:15px;letter-spacing:.5px;text-align:right;word-break:break-all;}
.bankcard .bnota{font-size:12.5px;color:#D9C7A8;font-weight:300;line-height:1.45;margin-top:8px;}
.bankcard .amt{font-family:'Playfair Display',serif;font-size:21px;font-weight:800;color:var(--gold);}
.bankcard .ref{background:#F7F1E4;color:var(--dark);border-radius:10px;padding:8px 10px;margin-top:10px;
 font-size:13.5px;text-align:center;line-height:1.5;}
.bankcard .ref b{font-family:monospace;font-size:16px;letter-spacing:1px;}

@media(min-width:720px){
 .cards{grid-template-columns:1fr 1fr;}
 .hgrid{grid-template-columns:repeat(4,1fr);}
 .cgrid{grid-template-columns:repeat(3,1fr);}
 .mgrid{grid-template-columns:repeat(6,1fr);}
 .sheet{max-width:600px;margin:0 auto;border-radius:22px;bottom:auto;top:50%;transform:translateY(-50%);left:16px;right:16px;}
}

.fluxo{max-width:640px;margin:18px auto 0;color:var(--ink2);font-size:14px;line-height:1.6;text-align:center;}
.fluxo b{color:var(--gold);}
.painel-acts{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:20px;}
.pdflink{color:var(--ink2);font-size:12.5px;letter-spacing:.4px;text-decoration:underline;text-underline-offset:3px;}
.optsem{display:flex;flex-wrap:wrap;gap:8px;}
.optsem .chip.out{opacity:.45;text-decoration:line-through;}
.semnota{margin-top:8px;font-size:12.5px;color:var(--ink2);line-height:1.45;}
/* ---- AÇAÍ: pedido em 4 passos (copo de 355 ml) ---- */
@keyframes soPop{0%{transform:scale(.97)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.opttop{display:flex;flex-wrap:wrap;gap:8px;}
.opttop .chip.sel::before{content:"✓ ";}
.sheet.acai{padding-bottom:0;max-height:94vh;}   /* um pouco mais alta: cabe tudo sem deslizar na maioria dos telemóveis */
.acai-top{display:flex;align-items:center;gap:13px;margin-bottom:10px;}
.acai-top img{flex:0 0 auto;width:60px;height:60px;border-radius:16px;object-fit:cover;box-shadow:0 5px 14px rgba(52,37,29,.16);}
.acai-top h3{margin:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.acai-top .sd{margin:5px 0 0;line-height:1.4;}
.mlpill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px 4px 8px;border-radius:30px;background:#4A2545;color:#F7F1E4;
 font-family:'Jost',system-ui,sans-serif;font-size:13px;font-weight:600;letter-spacing:.3px;white-space:nowrap;}
.mlpill svg{width:14px;height:14px;flex:0 0 auto;}
/* os 3 preços do copo, em lista (não são botões): fica aceso o que corresponde à escolha */
.acai-pr{border:1.5px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden;}
.acai-pr div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 13px;font-size:13.5px;line-height:1.3;color:var(--ink2);cursor:default;
 transition:background .18s ease,color .18s ease;}
.acai-pr div+div{border-top:1px solid var(--line);}
.acai-pr b{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap;}
.acai-pr b small{margin-left:3px;font-size:10.5px;font-weight:500;letter-spacing:.6px;}
.acai-pr div.on{background:#4A2545;color:#F7F1E4;font-weight:500;}
.acai-pr div.on b{color:#F7F1E4;}
.acai-pr div.on span::before{content:"✓ ";}
/* cabeçalho de cada passo */
.acai-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 7px;}
.acai-h .lbl{display:flex;align-items:center;gap:8px;margin:0;}
.acai-h .lbl i{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--dark);color:#F7F1E4;
 font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:0;}
.acai-h em{font-style:normal;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;background:#EAF2E4;color:#2E6B32;}
.acai-h em.pago{background:#F1EAF0;color:#4A2545;}
/* escolhas em grelha: alvos grandes e alinhados */
.opttop.g2,.opttop.g3{display:grid;gap:8px;}
.opttop.g2{grid-template-columns:1fr 1fr;}
.opttop.g3{grid-template-columns:repeat(3,1fr);}
.opttop.g2 .chip,.opttop.g3 .chip{padding:9px 8px;text-align:center;line-height:1.2;min-width:0;}
.opttop .chip small{display:block;margin-top:2px;font-size:11.5px;font-weight:600;line-height:1.2;}
.opttop .chip.tl{border-radius:16px;padding:7px 6px;}                 /* toppings: nome + "incluído" ou "+50 ECV" */
.opttop .chip small.inc{color:#2E6B32;}
.opttop .chip.sel small.inc{color:#CFE5C4;}
.opttop .chip.xt small{color:#4A2545;}
.opttop .chip.xt.sel{background:#4A2545;border-color:#4A2545;}
.opttop .chip.xt.sel small{color:#E8D8E6;}
/* escolha recomendada: estrela amarela ao lado do nome e "recomendamos" por baixo */
.opttop .chip.rec{padding:6px 8px;}
.opttop .chip .estrela{width:14px;height:14px;margin-left:5px;vertical-align:-2px;}
.opttop .chip small.rec{font-weight:500;letter-spacing:.2px;color:#8B5E3C;}
.opttop .chip.sel small.rec{color:#EAD9BE;}
/* rodapé fixo: de onde vem o total + botões */
.sheet.acai .optfoot{position:sticky;bottom:0;z-index:2;display:grid;grid-template-columns:auto 1fr;gap:9px 10px;
 margin:14px -16px 0;padding:10px 16px calc(13px + env(safe-area-inset-bottom));
 background:var(--cream);border-top:1px solid var(--line);box-shadow:0 -8px 18px rgba(52,37,29,.07);
 will-change:transform;}   /* camada própria: sem isto o Chrome deixa ver o conteúdo por baixo quando o rodapé cresce */
.sheet.acai #optRes{grid-column:1/-1;}
.acai-res{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:13.5px;line-height:1.5;color:var(--ink2);}
.acai-res b{font-weight:600;color:var(--ink);white-space:nowrap;}
.sheet.acai .optfoot .go{grid-column:2;grid-row:2;margin-top:0;padding:15px 10px;}
.sheet.acai .optfoot .gs{grid-column:1;grid-row:2;margin-top:0;width:auto;padding:0 18px;}
.sotag{display:inline-block;padding:1px 7px;border-radius:6px;background:#4A2545;color:#F7F1E4;font-weight:600;letter-spacing:.8px;font-size:11px;}
.drop-media figure button{display:block;width:100%;border:0;padding:0;background:none;cursor:pointer;}
.drop-media figure:hover img{transform:scale(1.03);}
.drop-media img{transition:transform .4s ease;}
/* ---- DESTAQUE: novidades de disponibilidade limitada ---- */
.drop{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;align-items:center;margin:18px 0 4px;
 padding:26px 26px 24px;border-radius:24px;background:linear-gradient(135deg,#2F4029 0%,#4E5937 62%,#66704A 100%);
 box-shadow:0 18px 40px rgba(47,33,25,.16);}
.drop-copy{color:#F7F1E4;}
.drop-tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;
 background:rgba(247,241,228,.13);border:1px solid rgba(243,213,179,.45);color:#F3D5B3;
 font-size:10.5px;font-weight:600;letter-spacing:2.2px;text-transform:uppercase;}
.drop-tag i{width:7px;height:7px;border-radius:50%;background:#F3D5B3;animation:dropPulse 1.6s ease-in-out infinite;}
@keyframes dropPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.drop-copy h2{font-family:'Playfair Display',serif;font-size:clamp(30px,4vw,44px);line-height:1.03;
 letter-spacing:-1px;margin:13px 0 10px;}
.drop-copy>p{font-size:15.5px;line-height:1.55;color:#EADFC9;max-width:460px;}
.drop-note{margin-top:14px;padding:11px 13px;border-radius:13px;background:rgba(0,0,0,.17);
 border-left:3px solid #F3D5B3;color:#EADFC9;font-size:12.5px;line-height:1.5;}
.drop-cta{display:inline-block;margin-top:16px;padding:13px 22px;border-radius:999px;background:var(--gold);
 color:#2A1B10;font-size:12.5px;font-weight:600;letter-spacing:1px;text-transform:uppercase;text-decoration:none;}
.drop-media{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;}
.drop-media figure{position:relative;border-radius:18px;overflow:hidden;background:#2E4023;
 box-shadow:0 10px 22px rgba(0,0,0,.18);}
.drop-media img{width:100%;height:260px;object-fit:cover;display:block;}
.drop-media figcaption{position:absolute;left:0;right:0;bottom:0;padding:38px 12px 12px;color:#fff;
 background:linear-gradient(180deg,transparent,rgba(24,17,12,.86));}
.drop-media figcaption b{display:block;font-family:'Playfair Display',serif;font-size:17px;}
.drop-media figcaption span{display:block;margin-top:2px;font-size:11.5px;color:#E6D6BC;}
.drop-media figcaption .drop-price{margin-top:5px;font-family:'Jost',sans-serif;font-size:15px;font-weight:600;color:#F3D5B3;letter-spacing:.5px;}
.drop-add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:9px;
 padding:11px 10px;border:0;border-radius:999px;background:var(--gold);color:#2A1B10;
 font-family:'Jost',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.8px;
 text-transform:uppercase;cursor:pointer;transition:transform .12s ease,filter .12s ease;}
.drop-add:hover{filter:brightness(1.07);}
.drop-add:active{transform:scale(.96);}
.drop-add i{font-style:normal;font-size:15px;line-height:1;}

/* ---- Selector de zona de entrega ---- */
.zonabox{position:relative;}
.zonalista{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;max-height:230px;
 overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;
 box-shadow:0 12px 30px rgba(52,37,29,.18);display:none;}
.zonalista.on{display:block;}
.zonalista button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
 padding:11px 13px;border:0;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;
 font:inherit;font-size:14px;color:var(--ink);text-align:left;}
.zonalista button:last-child{border-bottom:0;}
.zonalista button:hover{background:#FFFCF6;}
.zonalista button b{font-weight:600;color:var(--gold);white-space:nowrap;font-size:13.5px;}
.zonalista .marc{display:block;font-size:11px;color:var(--ink2);margin-top:2px;}
.zonaok{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;
 padding:10px 12px;border-radius:12px;background:#F3F7EF;border:1px solid #BFD3B3;font-size:13.5px;}
.zonaok b{color:var(--green2,#2F4029);}
.zonaaviso{margin-top:8px;padding:10px 12px;border-radius:12px;background:#FDF3E3;
 border-left:3px solid var(--gold);font-size:13px;color:var(--ink2);line-height:1.45;}

/* ---- Piso / sobretaxa de andar ---- */
.pisobox{display:flex;align-items:center;justify-content:space-between;gap:12px;
 padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;}
.pisobox .qty button{width:34px;height:34px;}
.pisonome{font-size:14px;font-weight:600;color:var(--ink);}
.pisonome small{display:block;font-size:12px;font-weight:400;color:var(--ink2);margin-top:1px;}
.elevbox{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;
 padding:10px 13px;border-radius:12px;background:#FDF3E3;}
.elevbox span{font-size:13px;color:var(--ink2);line-height:1.35;}
.elevchips{display:flex;gap:7px;flex-shrink:0;}
.elevchips button{padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;
 font:600 12.5px/1 inherit;color:var(--ink2);cursor:pointer;}
.elevchips button.sel{background:var(--dark);color:#F7F1E4;border-color:var(--dark);}
.pisonota{margin-top:8px;font-size:12px;color:var(--ink2);line-height:1.45;}
@media(max-width:760px){
 .drop{grid-template-columns:1fr;gap:18px;padding:20px 16px;}
 .drop-media img{height:200px;}
 .drop-copy>p{font-size:14.5px;}
}
/* ============ REORGANIZAÇÃO (menu logo no topo) ============ */
:root{--topo:72px;--salto:134px;}                 /* altura da barra do site · margem ao saltar para uma categoria */
@media(min-width:720px){:root{--topo:86px;--salto:150px;}}
.card,.drop,.combos,.menu-zone{scroll-margin-top:var(--salto);}
/* capa mais curta: o menu está logo abaixo */
.home-hero{min-height:0;padding:32px 46px;}
.home-copy h1{font-size:clamp(34px,4vw,50px);letter-spacing:-1.2px;line-height:1.05;}
.home-copy>p{margin-top:12px;}
.home-facts{margin-top:16px;}
@media(max-width:1020px){.home-hero{min-height:0;padding:28px 34px;}}
@media(max-width:719px){
 .home-hero{min-height:0;align-items:center;padding:17px 16px 16px;border-radius:20px;}
 .home-hero::after{background:linear-gradient(90deg,rgba(247,241,228,.97) 0%,rgba(247,241,228,.93) 50%,rgba(247,241,228,.3) 82%,rgba(247,241,228,.05) 100%);}
 .hero-slide{background-position:88% 42%;}
 .home-copy{max-width:76%;padding:0;}
 .home-copy h1{font-size:clamp(24px,7vw,30px);line-height:1.08;letter-spacing:-.6px;}
 .home-copy>p{margin-top:7px;font-size:13.5px;line-height:1.4;}
 .home-facts{display:none;}
}
/* recolher / entrega numa linha */
.order-panel{margin:12px 0 0;padding:0;border:0;background:none;box-shadow:none;}
.order-panel .modebox{max-width:none;margin:0;padding:9px 12px 10px;border-width:1.5px;border-radius:16px;
 display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px;}
.order-panel .modebox .avisoent{flex:1 0 100%;margin:0;}
.order-panel .modebox .chip{padding:8px 15px;font-size:14px;}
.order-panel .modebox .mnote{margin:0;font-size:12.5px;line-height:1.4;}
.order-panel .again{max-width:none;margin:10px 0 0;}
/* barra de categorias: sempre visível enquanto se percorre o menu */
.menu-zone{margin-top:10px;}
.catnav{position:sticky;top:var(--topo);z-index:55;display:flex;gap:6px;margin:0 -4px 12px;padding:7px 8px;overflow-x:auto;
 background:rgba(255,252,246,.96);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px rgba(52,37,29,.10);
 backdrop-filter:blur(12px);scrollbar-width:none;overscroll-behavior-x:contain;}
.catnav::-webkit-scrollbar{display:none;}
.catnav button{flex:0 0 auto;border:0;border-radius:11px;background:transparent;color:var(--ink);padding:10px 12px;
 font:600 11.5px/1 'Jost',sans-serif;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;cursor:pointer;
 transition:background .15s ease,color .15s ease;}
.catnav button.on{background:var(--dark);color:#fff;}
@media(hover:hover){.catnav button:not(.on):hover{background:#EFE4D0;}}
@media(min-width:720px){.catnav{margin:0 0 16px;}.catnav button{padding:11px 14px;}
 .catnav button:first-child{margin-left:auto;}.catnav button:last-child{margin-right:auto;}}   /* centra quando cabe; quando não cabe, desliza desde o 1.º */
/* destaque: fotos primeiro, texto depois (telemóvel) */
.drop{margin:0 0 18px;}
.drop-media figure{margin:0;}
.drop-media figcaption .drop-price:empty,.drop-st:empty{display:none;}
.drop-st{display:block;margin-top:7px;padding:6px 9px;border-radius:9px;background:rgba(140,47,47,.92);color:#fff;
 font-size:12px;font-weight:600;text-align:center;line-height:1.3;}
.drop-media figcaption .drop-st b{display:inline;font:inherit;}
.drop-media figure.off img{filter:grayscale(.9) brightness(.72);}
.drop-media figure.off .drop-add{display:none;}
.drop-media figure.off>button{cursor:default;}
.drop-media figure[hidden]{display:none;}
.drop-media figure .drop-add{display:flex;width:100%;margin-top:9px;padding:10px 8px;border-radius:999px;background:var(--gold);color:#2A1B10;}
.drop-media figcaption .drop-add span{display:inline;margin:0;font-size:inherit;color:inherit;}
.drop-media figcaption .drop-add i{font-size:16px;}
.drop-media.um{grid-template-columns:1fr;}
@media(max-width:760px){
 .drop{gap:13px;padding:16px 14px 16px;}
 .drop-copy{display:contents;}
 .drop-copy .drop-tag{order:1;justify-self:start;}
 .drop-copy h2{order:2;margin:-3px 0 0;font-size:29px;}
 .drop-media{order:3;gap:10px;}
 .drop-copy>p{order:4;}
 .drop-copy .drop-note{order:5;margin-top:0;}
 .drop-media img{height:176px;}
 .drop-media figcaption{padding:34px 10px 10px;}
}
/* depois do menu */
.como{margin:8px 0 34px;text-align:center;}
.como .fluxo{margin-top:0;}
.como .pdflink{display:inline-block;margin-top:12px;}
.best-section{margin:0 0 30px;}
/* a barra "Ver pedido" só aparece quando há pedido (o carrinho está sempre no topo) */
.bar:not(.has){display:none;}
/* ---- ECRÃ DE CONFIRMAÇÃO DO PEDIDO ---- */
.okcode{margin:12px 0;padding:14px;border-radius:14px;background:#F7F1E4;border:1px dashed var(--gold);
 text-align:center;}
.okcode b{display:block;font-family:'Playfair Display',serif;font-size:26px;letter-spacing:1px;color:var(--ink);}
.okcode small{display:block;margin-top:3px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ink2);}
.okpay{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);margin-bottom:10px;}
.okpay .ln{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:4px 0;}
.okpay .ln span{color:var(--ink2);}
.okstep{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.5;margin:7px 0;color:var(--ink);}
.okstep>b{flex:0 0 22px;height:22px;border-radius:50%;background:var(--green2);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:12px;}
.okstep span b{font-weight:700;color:var(--ink);}
.okfile{display:block;width:100%;margin-top:6px;padding:12px;border:1px dashed var(--gold);border-radius:12px;
 background:#FFFCF6;font-size:13px;color:var(--ink2);}
#okCompMsg{font-size:13px;margin-top:8px;line-height:1.5;}
/* redundância por WhatsApp — só aparece depois de anexar o comprovativo */
.okwa{margin-top:14px;padding:14px;border-radius:14px;border:1.5px solid var(--roxo);background:#FBF6FA;}
.okwa .lbl{color:var(--roxo);}
.okwa p{font-size:13px;line-height:1.5;color:var(--ink2);margin:4px 0 4px;}
.okwa-btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:9px;padding:14px;
 border-radius:12px;border:1.5px solid var(--roxo);background:var(--roxo);color:#fff;font:600 15px/1.2 'Jost',sans-serif;
 text-decoration:none;cursor:pointer;}
.okwa-btn.b2{background:#fff;color:var(--roxo);}
.okwa-btn svg{width:19px;height:19px;flex:0 0 19px;}
.okwa small{display:block;font-size:12.5px;line-height:1.45;color:var(--ink2);margin-top:8px;text-align:center;}
/* 08-10-2026 (noite): enviar pelo WhatsApp deixa de ser opcional — é o passo que conclui o pedido */
.okwa-btn.off{opacity:.42;pointer-events:none;}
.okwa-falta{font-size:13px;line-height:1.45;color:var(--ink2);margin-top:8px;text-align:center;}
.okwa-ok{margin-top:12px;font-size:14px;line-height:1.45;font-weight:600;color:#2E6B32;text-align:center;}
.okwa.chama{animation:okwaChama .5s ease 2;}
@keyframes okwaChama{50%{box-shadow:0 0 0 6px rgba(74,37,69,.3);}}

/* ===== IDENTIDADE: castanho + creme + roxo-açaí (a mesma dos cartões do Instagram) =====
   Os nomes --green/--wa ficam por compatibilidade; passam a apontar para o roxo. */
:root{--roxo:#4A2545;--roxo2:#63345C;--roxo3:#371A33;--lilas:#E6D2E1;
 --green:var(--roxo2);--green2:var(--roxo);--wa:var(--roxo);}
.go,.qbadge{color:#FBF4E6;}
.bar .ct .cnt{background:var(--roxo);}
.pas.pay{background:var(--roxo);border-color:var(--roxo);box-shadow:0 4px 12px rgba(74,37,69,.22);}
.hero .sub,.again .aglbl{color:var(--lilas);}
.again .agx{color:#C9A9C2;}
.hcell{background:var(--roxo3);}
.mapbtn svg{color:var(--roxo);}
.info{box-shadow:0 12px 26px rgba(74,37,69,.2);}
.zonaok b{color:var(--roxo);}
.drop{background:linear-gradient(135deg,var(--roxo3) 0%,var(--roxo) 58%,var(--roxo2) 100%);}
.drop-media figure{background:var(--roxo3);}

/* ===== CAPA: frase + produto em cada foto ===== */
.home-hero.capa{position:relative;isolation:isolate;display:block;min-height:0;padding:0;border-radius:22px;overflow:hidden;
 background:#F7F1E4;box-shadow:0 16px 38px rgba(52,37,29,.14);
 --esbate:linear-gradient(90deg,#F7F1E4 0%,#F7F1E4 44%,rgba(247,241,228,.9) 54%,rgba(247,241,228,.55) 65%,rgba(247,241,228,.18) 77%,rgba(247,241,228,0) 88%);}
.home-hero.capa::before{content:none;}
/* a foto ocupa a faixa e desvanece por baixo da frase (como na capa anterior) */
.home-hero.capa::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--esbate);}
.capa .capa-fotos{position:absolute;inset:0 0 0 34%;z-index:-1;}
.capa .hero-slide{position:absolute;inset:0;z-index:auto;background-size:cover;background-position:var(--px,70%) 42%;
 opacity:0;transition:opacity .9s ease;}
.capa .hero-slide.on{opacity:1;}
.capa .capa-txt{position:relative;box-sizing:border-box;width:61%;min-height:max(186px,var(--capa-h,0px));padding:14px 12px 12px 17px;
 display:flex;flex-direction:column;justify-content:center;color:var(--ink);
 --tom:var(--dark);--tom2:#7A5233;}                         /* as duas cores dos cartões alternam de foto para foto */
.capa.roxo .capa-txt{--tom:var(--roxo);--tom2:var(--roxo);}
.capa .capa-a{margin:0;font:italic 500 13px/1.3 'Jost',sans-serif;color:var(--tom2);transition:color .6s ease;}
.capa .capa-txt h1{margin:6px 0 0;max-width:none;font-family:'Playfair Display',serif;font-weight:700;
 font-size:clamp(20px,5.9vw,23px);line-height:1.12;letter-spacing:-.4px;color:var(--ink);text-wrap:balance;}
.capa .capa-sub{display:none;}
.capa .capa-acoes{margin-top:10px;min-height:36px;}
.capa .capa-cta{display:inline-flex;align-items:center;gap:7px;max-width:100%;border:0;border-radius:999px;padding:10px 13px;
 background:var(--tom);color:#FBF4E6;font:600 12px/1.15 'Jost',sans-serif;letter-spacing:.2px;text-align:left;cursor:pointer;
 box-shadow:0 5px 14px rgba(52,37,29,.2);transition:transform .12s ease,filter .12s ease,background-color .6s ease;}
.capa .capa-cta i{flex:none;font-style:normal;font-size:16px;line-height:1;}
.capa .capa-cta span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}      /* uma linha só: a altura da capa não muda */
.capa .capa-cta b{flex:none;font-weight:700;white-space:nowrap;}
.capa .capa-cta:active{transform:scale(.96);}
.capa .capa-pts{display:flex;gap:5px;margin-top:10px;min-height:4px;}
.capa .capa-pts button{position:relative;flex:none;width:22px;height:4px;padding:0;border:0;border-radius:4px;
 background:rgba(52,37,29,.2);overflow:visible;cursor:pointer;}
.capa .capa-pts button::before{content:"";position:absolute;inset:-12px -2px;}          /* área de toque */
.capa .capa-pts button::after{content:"";position:absolute;inset:0;border-radius:4px;background:var(--tom);transform:scaleX(0);transform-origin:left;}
.capa .capa-pts button.on::after{transform:scaleX(1);animation:capaEnche var(--capa-seg,6.5s) linear both;}
.capa.parada .capa-pts button.on::after{animation:none;}
@keyframes capaEnche{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.capa .capa-txt.entra .capa-a{animation:capaSobe .45s ease both;}
.capa .capa-txt.entra h1{animation:capaSobe .5s .09s ease both;}
.capa .capa-txt.entra .capa-cta{animation:capaSobe .45s .2s ease both;}
@keyframes capaSobe{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.topcart.salta{animation:saltaCnt .38s cubic-bezier(.34,1.56,.64,1);}
@keyframes saltaCnt{0%{transform:scale(1)}45%{transform:scale(1.13)}100%{transform:scale(1)}}
@media(hover:hover){.capa .capa-cta:hover{filter:brightness(1.07);}}
@media(max-width:380px){
 .capa .capa-txt{width:64%;padding-right:10px;}
 .capa .capa-cta{gap:5px;padding:10px 11px;font-size:11.5px;}
}
@media(min-width:720px){
 .home-hero.capa{--esbate:linear-gradient(90deg,#F7F1E4 0%,#F7F1E4 38%,rgba(247,241,228,.88) 47%,rgba(247,241,228,.45) 56%,rgba(247,241,228,.12) 64%,rgba(247,241,228,0) 72%);}
 .capa .capa-txt{width:54%;max-width:640px;min-height:max(300px,var(--capa-h,0px));padding:30px 30px 26px 44px;}
 .capa .capa-a{font-size:16px;}
 .capa .capa-txt h1{margin-top:10px;font-size:clamp(30px,3.3vw,42px);line-height:1.07;letter-spacing:-1px;}
 .capa .capa-acoes{margin-top:18px;min-height:46px;}
 .capa .capa-cta{padding:13px 20px;font-size:14px;}
 .capa .capa-pts{margin-top:18px;}
 .capa .capa-pts button{width:30px;}
 .capa .hero-slide{background-position:center;}
}
@media(min-width:1021px){
 .capa .capa-sub{display:block;margin:13px 0 0;max-width:460px;color:#6E4B2F;font-size:15px;line-height:1.5;}
}
/* entre 1021 e 1080 px a barra de topo não cabia inteira (o carrinho saía 2 px e a página deslizava de lado):
   o horário esconde-se um pouco mais cedo */
@media(min-width:1021px) and (max-width:1080px){
 .sitebar{grid-template-columns:auto 1fr auto;gap:14px;}
 .site-meta{display:none;}
}
@media(prefers-reduced-motion:reduce){
 .capa .hero-slide,.capa .capa-a,.capa .capa-cta{transition:none;}
 .capa .capa-txt.entra .capa-a,.capa .capa-txt.entra h1,.capa .capa-txt.entra .capa-cta,.capa .capa-pts button.on::after,.topcart.salta{animation:none;}
}

/* ===== "Os mais pedidos" logo a seguir ao destaque: uma fila compacta que desliza de lado ===== */
.menu-zone .best-section{margin:0 0 20px;scroll-margin-top:var(--salto);}
.menu-zone .best-section .section-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;max-width:none;margin:0 2px 10px;text-align:left;}
.menu-zone .best-section .section-heading h2{margin:0;font-size:22px;}
.menu-zone .best-section .section-heading h2:after{content:none;}
.menu-zone .best-section .section-heading p{display:none;margin:0;padding:0;font-size:13.5px;}
.menu-zone .best-grid{display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(140px,40vw);gap:10px;
 overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 10px;scrollbar-width:none;overscroll-behavior-x:contain;}
.menu-zone .best-grid::-webkit-scrollbar{display:none;}
.menu-zone .best-card,.menu-zone .best-card:nth-child(n+4){margin-top:0;scroll-snap-align:start;}

@media(min-width:720px){
 .menu-zone .best-section{margin-bottom:24px;}
 .menu-zone .best-section .section-heading h2{font-size:27px;}
 .menu-zone .best-section .section-heading p{display:block;}
 .menu-zone .best-grid{grid-auto-columns:minmax(132px,1fr);gap:12px;}
 .menu-zone .best-name{min-height:48px;}          /* três linhas: os botões + ficam todos à mesma altura */
}

/* ===== CAMPANHA AÇAÍ (liga-se no /admin) ===== */
.camp{display:none;align-items:center;gap:12px;width:100%;margin:16px 0 0;padding:14px 16px;border:none;border-radius:18px;cursor:pointer;
 font-family:inherit;text-align:left;color:#FBF4E6;
 background:linear-gradient(135deg,var(--roxo3) 0%,var(--roxo) 58%,var(--roxo2) 100%);box-shadow:0 12px 26px rgba(74,37,69,.24);}
.camp>span{flex:1;min-width:0;}
.camp em{display:block;font-style:normal;font-size:11.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;text-wrap:balance;color:var(--lilas);}
.capa h1 .cc-hoje{display:inline-block;vertical-align:middle;margin-left:4px;padding:3px 9px 3px 10px;border-radius:999px;background:var(--roxo);
 color:#FBF4E6;font:600 10.5px/1.35 'Jost',sans-serif;font-style:normal;letter-spacing:1.3px;text-transform:uppercase;white-space:nowrap;}
@media(min-width:720px){.capa h1 .cc-hoje{margin-left:10px;padding:5px 13px 5px 14px;font-size:13px;}}
.camp b{display:block;margin-top:3px;font-family:'Playfair Display',serif;font-size:20px;line-height:1.22;font-weight:800;}
.camp small{display:block;margin-top:5px;font-size:12.5px;line-height:1.45;font-weight:400;color:#EADDE6;}
.camp>i{flex:none;width:38px;height:38px;border-radius:50%;background:#FBF4E6;color:var(--roxo);font-style:normal;
 font-size:24px;line-height:38px;text-align:center;font-weight:500;}
@media(min-width:720px){.camp{padding:18px 22px;}.camp b{font-size:25px;}.camp small{font-size:13.5px;}}
.warn.campw{background:#F3E8F0;border-color:#C9A9C2;color:var(--roxo);}
.warn.campmais{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 9px 9px 13px;}
.warn.campmais span{min-width:0;font-weight:500;}
.warn.campmais button{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 15px 10px 12px;
 background:var(--roxo);color:#FBF4E6;font:600 14px/1 'Jost',sans-serif;white-space:nowrap;cursor:pointer;
 box-shadow:0 3px 9px rgba(74,37,69,.24);transition:transform .12s ease;}
.warn.campmais button i{font-style:normal;font-size:18px;line-height:.8;}
.warn.campmais button:active{transform:scale(.95);}
.campopt{background:#F3E8F0;border:1px solid #C9A9C2;color:var(--roxo);border-radius:12px;padding:9px 12px;
 font-size:13.5px;line-height:1.45;margin:0 0 12px;}
.horanota{display:none;font-size:13px;line-height:1.45;margin-top:8px;color:var(--ink2);}

/* ===== CAPA: foto da campanha do açaí (duas regras, cada uma na sua linha) ===== */
.capa .capa-camp{display:grid;gap:5px;margin-top:8px;}
.capa .capa-camp[hidden]{display:none;}
.capa .cc-l{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:12px;background:#FFFCF6;
 border:1px solid #D9BFD2;box-shadow:0 3px 10px rgba(74,37,69,.1);}
.capa .cc-l>b{flex:none;width:28px;text-align:center;font:800 27px/1 'Playfair Display',serif;color:var(--roxo);}
.capa .cc-l>span{display:block;min-width:0;}
.capa .cc-l small{display:block;font:500 11px/1.2 'Jost',sans-serif;color:var(--ink2);}
.capa .cc-l strong{display:block;margin-top:1px;font:700 14.5px/1.2 'Jost',sans-serif;color:var(--roxo);}
.capa .capa-camp p{margin:2px 1px 0;font:400 11px/1.35 'Jost',sans-serif;color:#5B4636;}
.capa.camp .capa-sub{display:none;}
.capa .capa-txt.entra .capa-camp{animation:capaSobe .5s .14s ease both;}
@media(min-width:720px){
 .capa .capa-camp{gap:8px;margin-top:16px;max-width:330px;}
 .capa .capa-camp p{margin-top:1px;font-size:13.5px;}
 .capa .cc-l{gap:12px;padding:10px 14px 10px 12px;border-radius:14px;}
 .capa .cc-l>b{width:38px;font-size:36px;}
 .capa .cc-l small{font-size:12.5px;}
 .capa .cc-l strong{font-size:18px;}
}
@media(min-width:1021px){                 /* ecrã largo: as duas regras lado a lado */
 .capa .capa-camp{grid-template-columns:1fr 1fr;gap:10px;max-width:540px;}
 .capa .capa-camp p{grid-column:1/-1;}
}
@media(prefers-reduced-motion:reduce){.capa .capa-txt.entra .capa-camp{animation:none;}}

/* ===== PEDIDO REGISTADO: janela de pagamento (09-10-2026, noite) =====
   Três zonas sempre à vista: topo (estado do pedido + relógio), dados da conta e, em baixo, os botões de
   anexar o comprovativo e de enviar. Só o meio desliza.
   Estados (classe na folha): est-pagar = falta transferir e anexar · est-enviar = falta enviar · est-feito. */
#doneSheet{padding:0;max-height:94vh;max-height:94dvh;overflow:hidden;flex-direction:column;}
#doneSheet.on{display:flex;}
.pg-topo{flex:none;display:flex;align-items:center;gap:12px;padding:17px 16px 16px;background:#8C2F2F;color:#FFF6EC;
 transition:background-color .35s ease;}
.pg-tt{flex:1;min-width:0;}
.sheet .pg-topo h3{margin:0;font-family:'Playfair Display',serif;font-size:22px;line-height:1.18;color:inherit;}
.pg-topo p{margin:6px 0 0;font-size:14px;line-height:1.45;color:inherit;}
.pg-rel{flex:none;min-width:78px;padding:8px 10px 7px;border-radius:14px;background:rgba(255,246,236,.16);
 border:1px solid rgba(255,246,236,.45);text-align:center;}
.pg-rel b{display:block;font:700 23px/1.1 'Jost',sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.5px;}
.pg-rel small{display:block;margin-top:3px;font-size:10.5px;line-height:1.2;letter-spacing:.5px;text-transform:uppercase;}
#doneSheet.est-enviar .pg-topo{background:var(--roxo);}
#doneSheet.est-feito .pg-topo{background:#2E6B32;}
.pg-corpo{flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px 12px;-webkit-overflow-scrolling:touch;}
.pg-corpo .sd{margin-bottom:0;}
#doneSheet.pagar #okCode,#doneSheet.pagar #okSubRef{display:none;}      /* a referência já está no quadro da conta */
.pgdados{border:1.5px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:12px;}
.pgvalor{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:12px 14px;background:#F3E8F0;color:var(--roxo);}
.pgvalor span{font-size:12.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;}
.pgvalor b{font-family:'Playfair Display',serif;font-size:27px;font-weight:800;white-space:nowrap;}
.pgdados .ln{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 10px 6px 14px;border-top:1px solid var(--line);font-size:15px;}
.pgdados .ln span{flex:none;width:74px;color:var(--ink2);font-size:13px;}
.pgdados .ln b{flex:1;min-width:0;font-weight:600;color:var(--ink);overflow-wrap:anywhere;}
.pgcop{flex:none;min-height:34px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--roxo);background:transparent;color:var(--roxo);
 font:600 12.5px/1 'Jost',sans-serif;cursor:pointer;}
.pgcop.ok{background:var(--roxo);color:#FBF4E6;}
.pg-pe{flex:none;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--cream);border-top:1px solid var(--line);
 box-shadow:0 -8px 18px rgba(52,37,29,.09);}
.pg-pe .okfile{display:flex;align-items:center;justify-content:center;gap:9px;box-sizing:border-box;margin:0;padding:15px 14px;border:0;border-radius:40px;
 background:var(--roxo);color:#FBF4E6;font:600 16.5px/1.2 'Jost',sans-serif;text-align:center;cursor:pointer;box-shadow:0 5px 14px rgba(74,37,69,.26);}
.pg-pe .okfile svg{flex:none;width:20px;height:20px;}
.pg-pe .okfile small{font-weight:400;font-size:13px;opacity:.9;}
#doneSheet.est-enviar .pg-pe .okfile,#doneSheet.est-feito .pg-pe .okfile{padding:9px 12px;background:transparent;color:#2E6B32;
 border:1.5px solid #9CC29C;box-shadow:none;font-size:14px;}
.pg-pe #okCompMsg{margin-top:6px;text-align:center;}
.pg-pe #okCompMsg:empty{display:none;}
.pg-pe .okwa{margin-top:10px;padding:0;border:0;border-radius:40px;background:transparent;}
.pg-pe .okwa-btn{margin-top:0;border-radius:40px;padding:15px 14px;font-size:16.5px;}
.pg-pe .okwa-btn.b2{margin-top:9px;padding:12px 14px;font-size:15px;}
.pg-pe .okwa-falta{margin-top:6px;}
.pg-pe .go{margin-top:10px;}
.footer-priv{grid-column:1/-1;color:#BCA991;font-size:11px;line-height:1.55;text-align:center;}
.footer-priv button{background:none;border:0;padding:0;color:#D9C7A8;font:inherit;text-decoration:underline;cursor:pointer;}
/* botão desactivado não recebe toques: assim o toque num produto esgotado chega ao cartão e é contado */
.best-card.blocked button:disabled,.drop-media figure.off button:disabled{pointer-events:none;}
</style>

let _navAct="", _navFixo="", _navY=null, _navT=0;
/* Ao tocar numa categoria fica assinalada ESSA (em duas colunas há duas à mesma altura),
   até o cliente voltar a deslizar a página. */
function irPara(id){
 const e=$(id); if(!e) return;
 _navFixo=id; _navY=null; clearTimeout(_navT); _navT=setTimeout(()=>{ _navY=window.scrollY; },250);
 espiarNav(true);
 e.scrollIntoView({behavior:"smooth",block:"start"});
}
function soltarNav(){          // chamado a cada deslize
 if(!_navFixo) return;
 if(_navY===null){ clearTimeout(_navT); _navT=setTimeout(()=>{ _navY=window.scrollY; },160); }   // ainda a chegar à categoria
 else if(Math.abs(window.scrollY-_navY)>8) _navFixo="";                                       // o cliente deslizou: volta ao normal
}
function espiarNav(forcar){
 const nav=$("catNav"); if(!nav) return;
 const linha=nav.getBoundingClientRect().bottom+18;
 let act=null, topAct=-1e9;
 nav.querySelectorAll("button").forEach(b=>{
  const e=$(b.dataset.alvo); if(!e) return;
  const y=e.getBoundingClientRect().top;
  if(y<=linha && y>topAct+1){ act=b; topAct=y; }      // a última categoria que já passou a barra (em colunas, a da esquerda)
 });
 if(_navFixo) act=nav.querySelector('button[data-alvo="'+_navFixo+'"]')||act;
 if(!act) act=nav.querySelector("button");
 if(!act || (act.dataset.alvo===_navAct && !forcar)) return;
 _navAct=act.dataset.alvo;
 nav.querySelectorAll("button").forEach(b=>{ const on=b===act; b.classList.toggle("on",on); if(on) b.setAttribute("aria-current","true"); else b.removeAttribute("aria-current"); });
 const x=Math.max(0,act.offsetLeft-(nav.clientWidth-act.offsetWidth)/2);
 try{ nav.scrollTo({left:x,behavior:forcar?"auto":"smooth"}); }catch(e){ nav.scrollLeft=x; }
}

/* ============================================================
   OPÇÕES DO DIA, ligadas no /admin (09-10-2026)
   1) "só hora marcada"  — esconde "Assim que possível"
   2) campanha do açaí   — 2 açaís: 2.º com −50% · 3 açaís: 1 grátis
   Ficam guardadas no servidor junto dos preços do menu (edit.p), com as duas chaves abaixo
   — as MESMAS do /admin, não mudar só aqui. Cada uma guarda {m: último dia, g: primeiro dia ou nada}
   (dias contados desde 01-01-2026, pela hora de Cabo Verde): vale de g — ou desde já — até ao fim de m,
   e depois desliga-se sozinha. Assim pode marcar-se de véspera uma campanha de um dia só.
   Sem resposta do servidor ficam desligadas e o site funciona como sempre.
   ============================================================ */
const CFG_ASAP="__cfg:asap_off", CFG_CAMP="__cfg:camp_acai";
const CFG_DIA0=Date.UTC(2026,0,1)/864e5;
let asapOff=false, campAcai=false;
/* cfgAsap / cfgCamp = {de, ate} das opções que ainda não acabaram (ou null)
   campServ = dia do próximo levantamento, dito pelo servidor nos horários (0 = ainda não se sabe) */
let cfgAsap=null, cfgCamp=null, campServ=0;
function diaCV(){
 const agora=new Date(); let y=0,m=0,d=0;
 try{
  new Intl.DateTimeFormat("en-GB",{timeZone:"Atlantic/Cape_Verde",year:"numeric",month:"numeric",day:"numeric"})
   .formatToParts(agora).forEach(x=>{ if(x.type==="year") y=+x.value; if(x.type==="month") m=+x.value; if(x.type==="day") d=+x.value; });
 }catch(e){}
 if(!y||!m||!d){ y=agora.getFullYear(); m=agora.getMonth()+1; d=agora.getDate(); }
 return Math.round(Date.UTC(y,m-1,d)/864e5-CFG_DIA0)+1;
}
function numDia(iso){ const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(iso||""); return m ? Math.round(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5-CFG_DIA0)+1 : 0; }
/* AS OPÇÕES VALEM PELO DIA EM QUE O PEDIDO É LEVANTADO, não pelo dia em que é feito.
   O servidor diz, nos horários, para que dia fica o próximo levantamento (campServ):
     · dentro dos dias da opção -> aplica-se (asapOff / campAcai);
     · antes do primeiro dia    -> a campanha só se ANUNCIA (campMostra), ainda sem desconto;
     · depois do último dia     -> nada (fechámos por esse dia, ou o pedido passa para outro).
   Por isso uma campanha "só amanhã" é anunciada já hoje, e quem encomenda depois de fecharmos — para
   levantar amanhã — já a tem. Enquanto o servidor não disser o dia, a campanha fica desligada. */
function acertarOpcoes(){
 const hoje=diaCV(), dia=campServ;
 const aplica=c=>!!(c && dia>0 && dia>=c.de && dia<=c.ate);
 campAcai = aplica(cfgCamp);
 asapOff = cfgAsap ? (dia>0 ? aplica(cfgAsap) : hoje>=cfgAsap.de) : false;
}
function campMostra(){ return !!(cfgCamp && campServ>0 && campServ<=cfgCamp.ate); }     // anunciada ou já a aplicar-se
function cfgSinal(){ return asapOff+"|"+campAcai+"|"+campMostra()+"|"+campQuando(); }
function lerConfig(ed){
 const hoje=diaCV(), p=(ed&&ed.p)||{};
 const viva=o=>(o && o.m>0 && hoje<=o.m) ? {de:(o.g>0?o.g:0), ate:o.m} : null;
 cfgAsap=viva(p[CFG_ASAP]); cfgCamp=viva(p[CFG_CAMP]);
 acertarOpcoes();
}
/* chegou do servidor o dia do próximo levantamento; devolve true se alguma opção mudou com isso */
function notarServico(hoje,iso){
 const antes=cfgSinal();
 campServ = hoje ? diaCV() : (numDia(iso)||campServ);
 acertarOpcoes();
 return antes!==cfgSinal();
}
/* volta a perguntar ao servidor (ao abrir o fecho do pedido e mesmo antes de enviar):
   o cliente pode ter a página aberta desde antes de se ligar ou desligar uma opção */
async function carregarConfig(){
 try{
  const ctl=(typeof AbortController!=="undefined")?new AbortController():null;
  const tm=ctl?setTimeout(()=>ctl.abort(),5000):0;
  const r=await fetch(PROMO_API+"/menu-edit",ctl?{signal:ctl.signal}:undefined);
  clearTimeout(tm);
  const d=await r.json();
  if(!d.erro) lerConfig(d.edit||null);
 }catch(e){}
}
function aplicarConfig(){
 if((cfgCamp||cfgAsap) && !campServ) fillSlots();   // há opções em vigor: falta saber para que dia fica o levantamento
 acertarHora();
 desenharCamp();
 if(typeof _capaPronta!=="undefined" && _capaPronta) capaCampanha();
 if($("cartSheet").classList.contains("on")) renderCart();

/* "Assim que possível" desligado no /admin: fica só a hora marcada */

 if(!a||!m) return;

 if(nota){ nota.style.display = asapOff ? "block" : "none"; nota.textContent = t("sohora"); }

/* ---------- CAMPANHA AÇAÍ ----------
   Só existe no site, onde o açaí é sempre pago por transferência; ao balcão (/vendas) o preço é o normal.
   Uma oferta por pedido:   2 açaís -> o mais barato com −50%   ·   3 ou mais -> o mais barato é grátis.
   Não acumula com códigos promocionais (fica o maior). Para mudar a percentagem basta este número. */
const CAMP_PCT2=50, CAMP_PROD="Açaí";
/* QUANDO é a campanha, para os textos:
   campDiaTxt  = "amanhã, sábado" enquanto o dia dela ainda não chegou (senão "")
   campQuando  = isso, ou "só hoje" no último dia, ou "" (vários dias, já a decorrer) */
function diaSemana(n){ try{ return new Intl.DateTimeFormat(LANG,{weekday:"long",timeZone:"UTC"}).format(new Date((CFG_DIA0+n-1)*864e5)); }catch(e){ return ""; } }
function campDiaTxt(){
 if(!cfgCamp) return "";
 const h=diaCV(), d=cfgCamp.de;
 if(!(d>h)) return "";
 return d===h+1 ? t("amanha")+", "+diaSemana(d) : diaSemana(d);
}
function campQuando(){ return cfgCamp ? (campDiaTxt() || (cfgCamp.ate===diaCV() ? t("soHoje") : "")) : ""; }
function campNotaDia(){ return campDiaTxt() ? ct("campPara")+" " : ""; }      // "Para pedidos levantados amanhã, sábado. "
function ct(k){
 const q=campQuando();
 return String(t(k)||"").replace(/\{x\}/g,CAMP_PCT2).replace(/\{h\}/g, q ? " · "+q : "").replace(/\{d\}/g, campDiaTxt());
}
function campCalc(){
 const z={v:0,tipo:0,n:0};
 if(!campAcai || !pagaAntes()) return z;
 const u=[]; cart.forEach(i=>{ if(i.name===CAMP_PROD) for(let k=0;k<i.q;k++) u.push(i.price); });
 z.n=u.length;
 if(z.n<2) return z;
 const barato=Math.min.apply(null,u);
 if(z.n>=3){ z.v=barato; z.tipo=3; } else { z.v=Math.round(barato*CAMP_PCT2/100); z.tipo=2; }
 return z;
}
function descCampBruto(){ return campCalc().v; }
/* botão do aviso "junte mais 1 açaí": mais um igual ao que já está no pedido */
function campJuntar(){ const it=cart.find(i=>i.name===CAMP_PROD); if(it) chg(it.key,1); }
/* faixa no topo do menu: aparece com a campanha anunciada ou a aplicar-se, e enquanto houver açaí */
function desenharCamp(){
 const b=$("campBanner"); if(!b) return;
 const ver=campMostra() && !lojaFechada && !!findMenuItem(CAMP_PROD) && !esgotados.includes(CAMP_PROD);
 b.style.display = ver ? "flex" : "none";
 if(ver) b.innerHTML='<span><em>'+ct("campTag").split(" · ").map(x=>x.replace(/ /g,"\u00a0")).join("\u00a0· ")+'</em><b>'+ct("campLinha")+'</b><small>'+campNotaDia()+ct("campNota")+'</small></span><i aria-hidden="true">+</i>';
}

/* Valor bruto do desconto do código promocional */
function descPromoBruto(){
 if(!promo) return 0;
 if(promo.tipo==="pct")  return Math.round(sub()*promo.v/100);
 if(promo.tipo==="fixo") return Math.min(promo.v, sub());
 if(promo.tipo==="catfree")
  return cart.reduce((s,i)=> s + ((i.icat===promo.cat) ? i.price*i.q : 0), 0);
 if(promo.tipo==="pctcat")
  return Math.round(cart.reduce((s,i)=> s + ((i.icat===promo.cat) ? i.price*i.q : 0), 0)*promo.v/100);
 return 0;
}

/* 5% para encomendas no site com levantamento em hora marcada */

/* NÃO ACUMULAM: aplica-se só o maior dos dois; o menor é anulado.
   Em caso de empate, fica o código (é o que o cliente trouxe na mão). */
/* Descontos do site = 5% da hora marcada (tudo menos açaí) + campanha do açaí (só açaí):
   nunca caem no mesmo produto, por isso somam-se. Contra um código promocional, fica o maior. */
function descSiteBruto(){ return descOnlineBruto()+descCampBruto(); }
function ganhaOnline(){ return descSiteBruto() > descPromoBruto(); }
function desconto(){    return ganhaOnline() ? 0 : descPromoBruto(); }
function descOnline(){  return ganhaOnline() ? descOnlineBruto() : 0; }
function descCamp(){    return ganhaOnline() ? descCampBruto() : 0; }
/* Houve um desconto anulado por não acumular? Devolve o texto a mostrar. */
function anulado(){
 const a=descPromoBruto(), b=descOnlineBruto(), c=descCampBruto();
 if(a>0 && (b+c)>0) return ganhaOnline()
   ? "Código "+promo.c+" não aplicado (−"+a+"$): fica o desconto maior."
   : (c>0 ? "Campanha do açaí"+(b>0?" e desconto online de "+DESC_ONLINE+"%":"")+" não aplicados (−"+(b+c)+"$): fica o desconto maior."
          : "Desconto online de "+DESC_ONLINE+"% não aplicado (−"+b+"$): fica o desconto maior.");
 return "";
}
function subLiq(){ return Math.max(0, sub()-descOnline()-descCamp()-desconto()); }
/* pesquisa sem distinguir acentos nem maiúsculas */
function semAcento(x){ return String(x||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }

function procurarZona(v){
 const q=semAcento(v.trim()), cx=$("zonaLista");
 const lista = q ? ZONAS.filter(z=>semAcento(z.n).includes(q)) : ZONAS;
 if(!lista.length){
  cx.innerHTML='<button type="button" onclick="fecharZonas()">'+t("zonanao")+'</button>';
  cx.classList.add("on"); return;

    <span>${z.n}<span class="marc">${z.z}${z.p>=ZONA_MARCADA_MIN?" · "+t("zonamarc"):""}</span></span>
    </button>`).join("");
 cx.classList.add("on");
}
function fecharZonas(){ $("zonaLista").classList.remove("on"); }
document.addEventListener("click", e=>{

});

function escolherZona(nome){
 zona = ZONAS.find(z=>z.n===nome) || null;

}
function aplicarZona(){
 const cx=$("zonaInfo");
 if(!zona){ cx.innerHTML=""; refreshChk(); return; }
 const marcada = zona.p>=ZONA_MARCADA_MIN;

  ? t("zonaavisohora").replace("{m}", leadZona())

  + `<div class="zonaaviso">${aviso}</div>`;
 /* zonas mais longe: só com hora marcada, e o site já obriga 30 min de
    antecedência nas entregas — não se promete o que não se cumpre */
 if(marcada){
  timeMode="marcada"; slotVal="";
  const chips=$("timeChips");

function taxa(){
 if(mode!=="entrega") return 0;
 if(promo && promo.tipo==="entrega") return 0;
 const base = zona ? zona.p : TAXA;
 /* Acima de 750 a entrega é grátis. Nas zonas de 400 ECV para cima,
    só com hora marcada — a viagem longa tem de caber no planeamento. */
 if(subLiq()>FREE){
  if(base<ZONA_MARCADA_MIN) return 0;
  if(timeMode==="marcada" && slotVal) return 0;
 }
 return base;
}
function servico(){ return (mode==="entrega") ? Math.round(subLiq()*TAXA_SERVICO/100) : 0; }
function total(){ return subLiq()+taxa()+taxaAndar()+servico(); }

 $("fPromoBtn").disabled=false;

 if(p.min && sub()<p.min){ $("promoMsg").innerHTML='<span class="pbad">Precisa de '+p.min+' ECV em produtos para usar este código.</span>'; return; }

 promo=p;

 $("fPromo").value=promo.c;
 refreshChk();
}
/* Confirma o uso no servidor mesmo antes de enviar — só aí o código é gasto */
async function tentarRedeemPromo(){
 if(!promo) return true;
 /* código que não chegou a dar desconto (ficou a campanha ou o desconto online, por serem maiores)
    não se gasta: o cliente pode usá-lo noutro pedido */
 if(promo.tipo!=="entrega" && desconto()===0) return true;
 try{
  const r=await fetch(PROMO_API+"/redeem?code="+encodeURIComponent(promo.c),{method:"POST"});
  const d=await r.json();
  if(d.erro){
   mtrErro("promo_gasto");
   alert("Este código deixou de estar disponível: "+d.erro);
   promo=null; $("fPromo").value=""; $("promoMsg").innerHTML='<span class="pbad">'+d.erro+'</span>';
   refreshChk(); return false;
  }
  return true;
 }catch(e){
  mtrErro("promo_rede");
  alert("Não foi possível confirmar o código agora. Tente enviar novamente.");
  return false;
 }
}

}

/* Horários vêm do servidor: recolha +10min, entrega +30min, de 5 em 5.
   Na recolha o servidor só devolve blocos com lugar livre (máx. 2 pedidos por bloco). */
let slotsReq=0;
async function fillSlots(){
 const sel=$("fSlot"); if(!sel) return;
 const req=++slotsReq;
 sel.innerHTML='<option value="">A carregar horários…</option>'; slotVal="";
 let d;
 try{
  const r=await fetch(PROMO_API+"/slots?mode="+mode+"&cost="+custoPrep()+
   (mode==="entrega"?"&ahead="+leadZona():""));
  d=await r.json();
 }catch(e){ d=null; }
 if(req!==slotsReq) return;                 // resposta antiga, ignora
 const out=(d&&d.slots)||[];
 if(!d){
  sel.innerHTML='<option value="">Horários indisponíveis</option>'; slotVal="";
  $("slotMsg").textContent="Não foi possível carregar os horários. Verifique a ligação e tente novamente.";
 }else if(!out.length){
  sel.innerHTML='<option value="">'+t("semhoras2")+'</option>'; slotVal=""; slotQuando=""; slotHoje=true;
  $("slotMsg").textContent=t("semhoras");
 }else{
  slotQuando=d.quando||""; slotHoje=(d.hoje!==false); diaISO=d.dia||"";
  const pref = slotHoje ? "" : (slotQuando.charAt(0).toUpperCase()+slotQuando.slice(1)+" · ");
  sel.innerHTML=out.map(o=>`<option value="${o}">${pref}${o}</option>`).join("");
  slotVal=out[0];
  if(!slotHoje){
   $("slotMsg").innerHTML=t("encerrado").replace("{o}",mode==="entrega"?t("oEnt"):t("oRec")).replace("{q}",slotQuando);
  }else{
   $("slotMsg").textContent=(mode==="entrega")
    ? t("slotent")
    : t("slotrec");
  }
 }
 if(d && out.length && notarServico(slotHoje,diaISO)) aplicarConfig();
 refreshChk();
}
function getGeo(){

 $("geoMsg").textContent="A obter localização…";
 navigator.geolocation.getCurrentPosition(p=>{
  geo=p.coords.latitude.toFixed(6)+","+p.coords.longitude.toFixed(6);

 mtr("pedido_tentativa");

 enviando=true;

    marcada), o cliente vê o total certo antes de transferir */
 {
  const cfg0=cfgSinal(), tot0=total(), tm0=timeMode;
  await carregarConfig();
  if(cfg0!==cfgSinal()){
   aplicarConfig();
   if(total()!==tot0){ enviando=false; avisar("cfgmudou"); return; }
   /* passou a ser só hora marcada: o cliente tem de ver (e poder mudar) a hora antes de enviar */
   if(timeMode!==tm0 || (asapOff && !(timeMode==="marcada" && slotVal))){ enviando=false; avisar("sohoraerro"); return; }
  }

 let blocoPrep=null;
 {
  const pedido = (timeMode==="marcada" && slotVal) ? slotVal : "asap";
  try{
   const r=await fetch(PROMO_API+"/reserve?mode="+mode+"&cost="+custoPrep()+"&slot="+encodeURIComponent(pedido)+
    (mode==="entrega"?"&ahead="+leadZona():""),{method:"POST"});

   if(d.quando){ slotQuando=d.quando; slotHoje=(d.hoje!==false); }

     if(timeMode!==tm0){ enviando=false; avisar("sohoraerro"); return; }

/* ---------- JANELA DE PAGAMENTO: topo, relógio e copiar ----------
   pagar  = falta transferir e anexar (topo vermelho, relógio a contar)
   enviar = falta só enviar o pedido (comprovativo escolhido, ou pedido que se paga ao balcão)

let pgFim=0, pgT=0;
