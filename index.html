/* copiar o número da conta ou a referência, para colar na aplicação do banco */
/* o que os botões "copiar" da janela de pagamento copiam: lido do pedido, não escrito no botão */
function pgValor(k){ const d=ultimoPedido||{}; return String(k==="conta"?((d.banco&&d.banco.c)||""):(d.code||"")).replace(/[^\w .-]/g,""); }
function copiar(btn,txt){
 const feito=()=>{ btn.textContent=t("copiado"); btn.classList.add("ok"); setTimeout(()=>{ btn.textContent=t("copiar"); btn.classList.remove("ok"); },1600); };
 const antigo=()=>{ try{ const ta=document.createElement("textarea"); ta.value=txt; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
   document.body.appendChild(ta); ta.select(); const r=document.execCommand("copy"); ta.remove(); if(r) feito(); }catch(e){} };
 try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(feito,antigo); return; } }catch(e){}
 antigo();
}
/* Reduz a foto no telemóvel antes de enviar — rede fraca é a regra, não a excepção. */
function prepararFicheiro(f){
 return new Promise((res,rej)=>{
  if(!/^image\//.test(f.type||"")){
   if(f.size>3.5e6) return rej(new Error("ficheiro grande"));
   const fr=new FileReader();
   fr.onload=()=>res({tipo:f.type||"application/pdf", b64:String(fr.result).split(",")[1]});
   fr.onerror=()=>rej(new Error("leitura")); fr.readAsDataURL(f); return;
  }
  const img=new Image(), url=URL.createObjectURL(f);
  img.onload=()=>{
   const max=1400, k=Math.min(1,max/Math.max(img.width,img.height));
   const c=document.createElement("canvas");
   c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
   c.getContext("2d").drawImage(img,0,0,c.width,c.height);
   URL.revokeObjectURL(url);
   res({tipo:"image/jpeg", b64:c.toDataURL("image/jpeg",0.72).split(",")[1]});
  };
  img.onerror=()=>{URL.revokeObjectURL(url); rej(new Error("imagem"));};
  img.src=url;
 });
}

 mtr("comprovativo_anexado");

 try{

/* ---------- REDUNDÂNCIA POR WHATSAPP (08-10-2026) ----------
   Depois de anexar o comprovativo, o cliente pode mandar também o pedido por WhatsApp.
   Só aparece com um ficheiro escolhido, e aparece mesmo que o envio para o servidor falhe.
   O wa.me só leva texto: a foto vai no passo 2 (partilhar -> WhatsApp -> conversa da
   Emma's Place, que fica no topo da lista por ter acabado de ser aberta no passo 1). */
const WA_PEDIDOS="2389895324";   // número que recebe os pedidos (só algarismos, com o 238)
const MARCA_COMP="{{comprovativo}}";
let compFicheiro=null, compEstado="";
function textoWhatsApp(){
 if(!ultimoPedido) return "";
 const linha = compEstado==="ok"   ? "Comprovativo: anexado no site ✓ — envio também a foto aqui."
             : compEstado==="erro" ? "Comprovativo: não consegui anexar no site — envio a foto aqui."
             :                       "Comprovativo: envio a foto aqui.";
 return String(ultimoPedido.resumo||"").split(MARCA_COMP).join(linha);
}
function podePartilhar(f){
 try{ return !!(f && navigator.share && navigator.canShare && navigator.canShare({files:[f]})); }catch(e){ return false; }
}
/* ---------- WHATSAPP OBRIGATÓRIO (08-10-2026, noite) ----------
   O pedido fica sempre registado no sistema; além disso, o cliente tem de o enviar pelo WhatsApp
   para o concluir. O botão "Enviar pedido" só fica activo depois de anexar o comprovativo
   (nos pedidos pagos ao balcão fica activo logo). "Fechar" só aparece depois desse toque.
   Limites do WhatsApp, que o site não consegue contornar: é o cliente que carrega em enviar
   dentro do WhatsApp, e a ligação wa.me só leva texto — a foto vai no toque seguinte. */
let waFeito=false;
function waPronto(){ return !!ultimoPedido && (!ultimoPedido.precisa || !!compFicheiro); }
function mostrarWa(){
 const box=$("okWaBox"); if(!box) return;
 if(!ultimoPedido){ box.style.display="none"; return; }
 const a=$("okWa1"), pronto=waPronto();
 a.classList.toggle("off", !pronto);
 a.setAttribute("aria-disabled", pronto?"false":"true");
 /* a ligação fica na página SEM o texto do pedido (tem nome, contacto e morada, e o Clarity regista
    o endereço das ligações em que se toca). O texto entra só no momento do toque, em waAberto(). */
 if(pronto) a.href="https://wa.me/"+WA_PEDIDOS;
 else a.removeAttribute("href");
 $("okWaFalta").style.display = pronto ? "none" : "block";
 $("okWaDepois").style.display = waFeito ? "block" : "none";
 const pode = !!compFicheiro && podePartilhar(compFicheiro);
 $("okWa2").style.display = pode ? "" : "none";
 $("okWaDica").textContent = compFicheiro ? t(pode?"okWa2Dica":"okWaAnexo") : "";
 $("okFecharBtn").style.display = waFeito ? "" : "none";
 box.style.display="block";
 desenharTopoPg();
}
/* toque em "Enviar pedido": o WhatsApp abre com este mesmo toque (é uma ligação normal) */
function waAberto(){
 if(!waPronto()) return false;
 $("okWa1").href="https://wa.me/"+WA_PEDIDOS+"?text="+encodeURIComponent(textoWhatsApp());   // é este endereço que o toque abre
 mtr("whatsapp_enviado");

}

/* ---------- REPETIR ÚLTIMO PEDIDO (guardado no telemóvel do cliente) ---------- */
const LSK="ep_ultimo_pedido", VALIDADE=60*86400000; // 60 dias
function guardarUltimo(){
 try{
  localStorage.setItem(LSK, JSON.stringify({
   t:Date.now(), mode:mode,
   nome:$("fName").value.trim(), addr:$("fAddr").value.trim(), zona:(zona?zona.n:""),
   items:cart.map(i=>({n:i.name,m:i.meta,q:i.q}))
  }));
 }catch(e){}
}
function lerUltimo(){
 try{
  const r=localStorage.getItem(LSK); if(!r) return null;
  const d=JSON.parse(r);
  if(!d.items||!d.items.length) return null;
  if(Date.now()-d.t>VALIDADE) return null;
  return d;
 }catch(e){ return null; }
}
function esquecerUltimo(){ try{localStorage.removeItem(LSK);}catch(e){} $("againBox").style.display="none"; }

function acharItem(nome){
 nome=nomeAtual(nome);
 for(const c of MENU){ const i=c.items.find(x=>x.n===nome); if(i) return {cat:c,item:i}; }
 return null;
}
function mostrarRepetir(){
 const d=lerUltimo(); const box=$("againBox"); if(!box) return;
 if(!d){ box.style.display="none"; return; }
 const n=d.items.reduce((s,i)=>s+i.q,0);
 const lista=d.items.map(i=>i.q+"x "+td(i.n)).join(", ");
 box.style.display="block";
 box.innerHTML=`<div class="agtop"><span class="aglbl">${t("ultimo")}</span>
   <button class="agx" onclick="esquecerUltimo()" aria-label="Esquecer">✕</button></div>
  <div class="agtxt">${lista}</div>
  <button class="agbtn" onclick="repetirUltimo()">${t("repetir")} (${n} ${n===1?t("item"):t("itens")})</button>`;
}
function repetirUltimo(){
 const d=lerUltimo(); if(!d) return;
 mtr("repetir_pedido");
 cart=[];
 if(!modoEscolhido && d.mode && d.mode!==mode) setMode(d.mode,false);
 const faltam=[];
 d.items.forEach(s=>{
  const m=s.m||{};
  if(m.combo){
   const cb=COMBOS.find(x=>x.n===m.combo);
   if(!cb){faltam.push(s.n);return;}
   for(let k=0;k<s.q;k++) addToCart("Combo "+cb.n, cb.p, [cb.d], 0, {combo:cb.n}, null, PT_COMBO);
   return;
  }
  const f=acharItem(s.n);
  if(!f){faltam.push(s.n);return;}
  if(esgotados.includes(nomeAtual(s.n))){faltam.push(s.n+" (acabou hoje)");return;}
  if(mode==="entrega"&&f.item.nd){faltam.push(s.n+" (só no local)");return;}
  if(f.item.top){   // açaí: repõe o que o cliente escolheu e recalcula com os preços de hoje
   if(!Array.isArray(m.top)){ faltam.push(s.n+" (escolha de novo o que leva)"); return; }
   const top=f.item.top.filter(x=>m.top.includes(x)), xt=f.item.xt.filter(x=>(m.xt||[]).includes(x));
   for(let k=0;k<s.q;k++) addToCart(f.item.n, precoAcaiDe(f.item,top,xt), optsAcai(f.item,top,xt), f.item.nd, {top,xt}, f.cat.cat, (f.item.pt!=null?f.item.pt:f.cat.pt));
   return;
  }
  // recalcular sempre com os preços actuais
  let price=(m.size==="G"&&f.item.g)?f.item.g:f.item.p, opts=[];
  if(f.item.g&&m.size) opts.push(m.size==="G"?"Grande":"Médio");
  if(f.cat.milk&&!f.item.nm&&m.milk&&m.milk!=="Normal"){
   const L=LEITES.find(l=>l[0]===m.milk);
   if(L){ price+=L[1]; opts.push("leite "+m.milk.toLowerCase()); }
  }
  (m.extras||[]).forEach(en=>{
   const e=(f.cat.extras||[]).find(x=>x[0]===en);
   if(e){ price+=e[1]; opts.push(en.toLowerCase()); }
  });
  for(let k=0;k<s.q;k++) addToCart(f.item.n, price, opts, f.item.nd, m, f.cat.cat, (f.item.pt!=null?f.item.pt:f.cat.pt));
 });
 if(d.nome) $("fName").value=d.nome;
 if(d.tel) $("fTel").value=d.tel;
 if(d.addr) $("fAddr").value=d.addr;
 if(d.zona){ const z=ZONAS.find(x=>x.n===d.zona); if(z){ zona=z; $("fZona").value=z.n; aplicarZona(); } }
 if(typeof d.piso==="number"){ piso=Math.max(0,Math.min(30,d.piso)); semElevador=!!d.semElevador;
  $("pisoVal").textContent=piso; $("pisoNome").innerHTML=nomePiso(piso)+"<small>"+notaPiso(piso)+"</small>";
  $("elevBox").style.display=piso>=4?"flex":"none"; atualizarElevChips(); }
 if(faltam.length) alert("Não foi possível repetir estes produtos:\n\n"+faltam.join("\n"));
 openCart();
}

  b.innerHTML="<b>Estamos temporariamente fechados.</b><br>"+
   (msgFechada||"Não estamos a aceitar encomendas neste momento. Volte mais tarde.");
 }else b.style.display="none";
 document.querySelector(".bar").style.display=lojaFechada?"none":"";
 build();
}

/* Alterações feitas no painel de gestão: preços, produtos removidos e novos.
   Se o servidor não responder, fica o menu de base deste ficheiro. */
async function carregarMenuEdit(){
 let ed=null;
 try{
  const r=await fetch(PROMO_API+"/menu-edit");
  const d=await r.json();
  if(!d.erro){ ed=d.edit||null; lerConfig(ed); }
 }catch(e){}
 aplicarConfig();
 if(!ed) return;
 ed=migrarNomes(ed);
 // preços alterados
 MENU.forEach(c=>c.items.forEach(i=>{
  const o=ed.p&&ed.p[i.n];
  if(i.top){   // açaí: três preços próprios no /admin (chaves ACAI_K); sem valor no painel vale o do código
   Object.keys(ACAI_K).forEach(k=>{ const a=ed.p&&ed.p[ACAI_K[k]]; if(a&&a.m>0) i[k]=a.m; });
   return;
  }
  if(!o) return;
  if(o.m!=null) i.p=o.m;
  if(o.g!=null) i.g=o.g; else if(o.g===null && "g" in o) delete i.g;
 }));
 // produtos novos
 const norm=s=>String(s||"").replace(/&amp;/g,"&").trim().toUpperCase();
 (ed.add||[]).forEach(a=>{
  const c=MENU.find(x=>norm(x.cat)===norm(a.c));
  if(!c) return;
  if(c.items.some(i=>i.n===a.n)) return;
  const novo={n:a.n,p:a.m}; if(a.g) novo.g=a.g; if(a.d) novo.d=a.d;
  c.items.push(novo);
 });
 // produtos removidos
 const off=ed.off||[];
 if(off.length) MENU.forEach(c=>{ c.items=c.items.filter(i=>!off.includes(i.n)); });
 // ordem definida no painel de gestão
 const ord=ed.ord||{};
 MENU.forEach(c=>{
  const lista=ord[c.cat] || ord[norm(c.cat)] ||
   Object.keys(ord).filter(k=>norm(k)===norm(c.cat)).map(k=>ord[k])[0];
  if(!lista||!lista.length) return;
  c.items.sort((a,b)=>{
   const ia=lista.indexOf(a.n), ib=lista.indexOf(b.n);
   return (ia<0?999:ia)-(ib<0?999:ib);
  });
 });
 // combos: preço, removidos, novos e ordem
 (ed.cp||{}) && Object.keys(ed.cp||{}).forEach(n=>{
  const c=COMBOS.find(x=>x.n===n); if(c) c.p=ed.cp[n];
 });
 const coff=ed.coff||[];
 if(coff.length){ const filtrado=COMBOS.filter(c=>!coff.includes(c.n)); COMBOS.length=0; COMBOS.push(...filtrado); }
 (ed.cadd||[]).forEach(a=>{
  if(COMBOS.some(c=>c.n===a.n)) return;
  COMBOS.push({n:a.n,d:a.d,p:a.p});
 });
 const cord=ed.cord||[];
 if(cord.length) COMBOS.sort((a,b)=>{
  const ia=cord.indexOf(a.n), ib=cord.indexOf(b.n);
  return (ia<0?999:ia)-(ib<0?999:ib);
 });
}
async function carregarEsgotados(){
 try{
  const r=await fetch(PROMO_API+"/soldout");
  const d=await r.json();
  esgotados = (d.itens || []).map(nomeAtual);
 }catch(e){ esgotados=[]; }
 // produtos cujo stock do dia chegou a zero contam como esgotados
 try{
  const rs=await fetch(PROMO_API+"/stock-dia");
  const ds=await rs.json();
  const st=chavesAtuais(ds.itens||{});
  Object.keys(st).forEach(n=>{ if(st[n]<=0 && !esgotados.includes(n)) esgotados.push(n); });
 }catch(e){}
 build();
 // tirar do carrinho o que entretanto esgotou
 const fora=cart.filter(i=>esgotados.includes(i.name));
 if(fora.length){
  cart=cart.filter(i=>!esgotados.includes(i.name));
  refresh(); renderCart();
  alert("Estes produtos acabaram por hoje e foram retirados do seu pedido:\n\n"+fora.map(i=>i.name).join("\n"));
 }
}

 document.querySelectorAll("[data-i18n]").forEach(el=>{ el.innerHTML=t(el.dataset.i18n); });
 document.querySelectorAll("[data-home-i18n]").forEach(el=>{ el.textContent=ht(el.dataset.homeI18n); });
 if(typeof _capaPronta!=="undefined" && _capaPronta){ desenharCapa(false); capaMedir(); }
 // campos de texto
 const ph=[["fName","nomeph"],["fAddr","moradaph"],["fNotes","notasph"],["fPromo","promoph"],["fZona","zonaph"]];

 // nota do modo de entrega

 if(mn) mn.innerHTML=(mode==="entrega")?t("notaent"):t("notarec");
 // aviso de fechado

 });
 if(entregasOff && mode==="entrega") setMode("recolha", true);
 const av=$("avisoEntregas");
 if(av){ av.style.display = entregasOff ? "block" : "none"; av.textContent = t("entsusp"); }

 const b=$("bannerFechado");
 if(b&&lojaFechada) b.innerHTML=t("fechado")+"<br>"+(msgFechada||t("fechadosub"));
 // caixa "sem pré-pagamento"
 const np=$("noPayBox"); if(np) np.innerHTML=t("balcao");
 rotularChips();
 acertarHora();
 build();
 mostrarRepetir();
 if($("cartSheet").classList.contains("on")) renderCart();
 if($("chkSheet").classList.contains("on")) refreshChk();
 mtrRodape();
}

build(); refresh(); rotularChips(); mostrarRepetir();
LANG=detectarIdioma(); document.documentElement.lang=LANG; traduzir(); mtrTag("idioma",LANG);
/* ---- CAPA: em cada foto, uma frase e o produto dessa foto ----
   a = a desculpa · b = a resposta (linha dos cartões do Instagram). Só em português;
   nas outras línguas fica o título normal. Para trocar frases, basta editar esta lista.
   A ordem tem de ser a das fotos da capa. Produto esgotado ou retirado sai da rotação. */
const CAPA=[
 {prod:"Frappé de Caramelo",    a:"«Só vim buscar um café.»", b:"E saíste com um Frappé de Caramelo."},
 {prod:"Frappé de Chocolate",   a:"«Fila nas Finanças?»",     b:"Leva um Frappé de Chocolate. A senha demora."},
 {prod:"Iced Matcha Latte", a:"«Verde? Isso é chá?»",     b:"É matcha. Prova e depois falamos."},
 {prod:"Açaí",              a:"«Talvez depois.»",         b:"Depois o açaí já ESGOTOU."},
 /* CAMPANHA DO AÇAÍ — só entra na rotação com a campanha ligada no /admin. Nessa altura ocupa o lugar da
    frase do açaí (usa a mesma foto — foto:3), é a primeira a aparecer e fica "mais" milésimos além das outras.
    Os textos estão nos 5 idiomas, nas chaves capaCamp* e cc*. */
 {prod:"Açaí", camp:true, foto:3, mais:3000}
];
const CAPA_SEG=6500;
let _capaK=0, _capaT=0, _capaPts="", _capaCamp=false;
function capaDur(i){ return CAPA_SEG+((CAPA[i]&&CAPA[i].mais)||0); }
function capaLista(){
 const l=[];
 CAPA.forEach((c,i)=>{
  const f=findMenuItem(c.prod); if(!f || esgotados.includes(f.item.n)) return;
  if(c.camp){ if(campMostra()) l.unshift(i); return; }
  if(campMostra() && c.prod===CAMP_PROD) return;
  l.push(i);
 });
 return l.length?l:[0];
}
/* texto de uma foto: frase + resposta, ou o quadro da campanha (3 açaís -> 1 grátis · 2 açaís -> 2.º com −50%) */
function capaTexto(i){
 const sec=document.querySelector(".home-hero.capa"), c=CAPA[i], pt=(LANG==="pt"), q=$("capaCamp");
 sec.classList.toggle("camp",!!c.camp);
 if(c.camp){
  $("capaA").textContent=ct("capaCampA");
  const qd=campQuando();
  $("home-title").innerHTML=esc(ct("capaCampB"))+(qd?' <em class="cc-hoje">'+esc(qd)+'</em>':"");
  if(q){ q.hidden=false; q.innerHTML=
   '<div class="cc-l"><b>3</b><span><small>'+ct("ccNoCarr")+'</small><strong>'+ct("ccGratis")+'</strong></span></div>'+
   '<div class="cc-l"><b>2</b><span><small>'+ct("ccNoCarr")+'</small><strong>'+ct("ccPct")+'</strong></span></div>'+
   '<p>'+campNotaDia()+ct("ccNota")+'</p>'; }
 }else{
  $("capaA").textContent = pt ? c.a : ht("heroKicker");
  $("home-title").textContent = pt ? c.b : ht("heroTitle");
  if(q){ q.hidden=true; q.innerHTML=""; }
 }
}
function desenharCapa(animar){
 const sec=document.querySelector(".home-hero.capa"); if(!sec) return;
 const lista=capaLista(); if(!lista.includes(_capaK)) _capaK=lista[0];
 const c=CAPA[_capaK], f=findMenuItem(c.prod), foto=(c.foto!=null?c.foto:_capaK);
 sec.querySelectorAll(".hero-slide").forEach((s,i)=>s.classList.toggle("on",i===foto));
 sec.classList.toggle("roxo",c.camp?true:_capaK%2===1);
 sec.style.setProperty("--capa-seg",(capaDur(_capaK)/1000)+"s");      // a barrinha enche no tempo desta foto
 capaTexto(_capaK);
 const cta=$("capaCta"), fim=!f||esgotados.includes(f.item.n);
 if(f && !fim && !lojaFechada){
  const p=f.item.top ? Math.min(f.item.p,f.item.sp||f.item.p) : f.item.p;
  cta.hidden=false;
  cta.innerHTML='<i aria-hidden="true">+</i><span>'+esc(td(f.item.n))+'</span><b>'+p+'$</b>';
  cta.onclick=()=>pick(f.ci,f.ii);
 } else { cta.hidden=true; cta.onclick=null; }
 const pts = lista.length>1 ? lista.map(i=>`<button type="button" class="${i===_capaK?"on":""}" onclick="capaIr(${i})" aria-label="${esc(CAPA[i].camp?ct("capaCampB"):td(CAPA[i].prod))}"></button>`).join("") : "";
 if(pts!==_capaPts || animar){ $("capaPts").innerHTML=pts; _capaPts=pts; }
 if(animar){ const tx=sec.querySelector(".capa-txt"); tx.classList.remove("entra"); void tx.offsetWidth; tx.classList.add("entra"); }
}
/* Todas as fotos com a mesma altura: mede-se o texto mais alto das fotos em rotação (a da campanha incluída)
   e o painel fica com essa altura, para a página não saltar quando a capa roda.
   Repete-se ao mudar de língua, de largura ou de letras, e quando a campanha se liga ou desliga. */
function capaMedir(){
 const sec=document.querySelector(".home-hero.capa"); if(!sec) return;
 const tx=sec.querySelector(".capa-txt"); if(!tx||!$("capaA")||!$("home-title")) return;
 sec.style.setProperty("--capa-h","0px");
 let max=0;
 capaLista().forEach(i=>{ capaTexto(i); max=Math.max(max,Math.ceil(tx.scrollHeight)); });
 capaTexto(_capaK);
 sec.style.setProperty("--capa-h",max+"px");
}
function capaIr(i){ _capaK=i; desenharCapa(true); capaRelogio(); }
/* cada foto fica o seu tempo (capaDur): por isso é um temporizador que se volta a armar, e não um intervalo fixo */
function capaRelogio(){
 clearTimeout(_capaT);
 const sec=document.querySelector(".home-hero.capa"); if(!sec) return;
 let parado=false; try{ parado=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
 sec.classList.toggle("parada",parado);
 sec.style.setProperty("--capa-seg",(capaDur(_capaK)/1000)+"s");
 if(parado) return;
 _capaT=setTimeout(()=>{
  if(!(document.hidden || document.querySelector(".sheet.on"))){      // não roda com um painel aberto
   const l=capaLista();
   if(l.length>1){ _capaK=l[(l.indexOf(_capaK)+1)%l.length]; desenharCapa(true); }
  }
  capaRelogio();
 },capaDur(_capaK));
}
/* a campanha ligou-se ou desligou-se: a capa abre na foto da campanha (ou volta à primeira) e mede-se de novo */
function capaCampanha(){
 if(campMostra()===_capaCamp) return;
 _capaCamp=campMostra();
 _capaK=capaLista()[0];
 desenharCapa(true); capaMedir(); capaRelogio();
}
var _capaPronta=true;          // antes desta linha a lista CAPA ainda não existe: build() e traduzir() não a podem usar
desenharCapa(false); capaMedir(); capaRelogio();
(function(){ let t=0, w=window.innerWidth;
 window.addEventListener("resize",()=>{ if(window.innerWidth===w) return; w=window.innerWidth; clearTimeout(t); t=setTimeout(capaMedir,120); });
 try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(capaMedir); }catch(e){}
})();

/* O carrinho do topo dá um pequeno salto quando entra um produto */
(function(){
 const c=$("topCnt"); if(!c || !window.MutationObserver) return;
 let ant=c.textContent;
 new MutationObserver(()=>{
  const agora=c.textContent; if(agora===ant) return;
  const subiu=(+agora||0)>(+ant||0); ant=agora; if(!subiu) return;
  const b=c.closest(".topcart"); if(!b) return;
  b.classList.remove("salta"); void b.offsetWidth; b.classList.add("salta");
 }).observe(c,{childList:true,characterData:true,subtree:true});
})();

/* Pequena confirmação ao adicionar — o cliente vê que registou */
function pulsar(){
 const b=document.querySelector(".bar .ct");
 if(!b) return;
 b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse");
}

(function(){
 const a=document.getElementById("bgm"), btn=document.getElementById("musicBtn");
 if(!a||!btn) return;
 if(/COLOQUE-AQUI/.test(a.getAttribute("src")||"")){ btn.style.display="none"; return; }   // ainda sem música: esconder
 let alvo=0.55, fadeT=null;
 function fade(ligar){
  clearInterval(fadeT);
  if(ligar){ a.volume=0; a.play().catch(()=>{}); }
  fadeT=setInterval(()=>{
   a.volume = Math.max(0, Math.min(1, a.volume + (ligar?0.04:-0.04)));
   if(ligar && a.volume>=alvo-.01){ a.volume=alvo; clearInterval(fadeT); }
   if(!ligar && a.volume<=0.01){ a.volume=0; a.pause(); clearInterval(fadeT); }
  }, 60);
 }
 window.alternarMusica=function(){
  const ligar=!btn.classList.contains("on");
  btn.classList.toggle("on", ligar);
  fade(ligar);
  try{ localStorage.setItem("ep_musica", ligar?"1":"0"); }catch(e){}
 };
 /* Nunca liga sozinha — precisa sempre de um toque. É a única forma
    fiável em todos os browsers, e é a promessa que fazemos ao cliente. */
})();

carregarEstado();
carregarMenuEdit().then(carregarEsgotados);
</script>
