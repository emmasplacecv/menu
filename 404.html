<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | Emma's Place</title>
<meta name="description" content="Esta página não existe. Volte ao início ou veja o menu do Emma's Place, na Praia.">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo.webp">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--cream:#F7F1E4;--ink:#34251D;--ink2:#785B42;--gold:#B8783D;--roxo:#4A2259;}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px;
 background:radial-gradient(circle at 12% 6%,rgba(255,255,255,.75),transparent 30%),var(--cream);color:var(--ink);
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}
main{width:100%;max-width:460px;text-align:center;}
.logo{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#fff;margin:0 auto 18px;display:block;}
.cod{font:700 64px/1 Georgia,"Times New Roman",serif;color:var(--roxo);letter-spacing:2px;}
h1{margin:10px 0 8px;font:700 26px/1.15 Georgia,"Times New Roman",serif;}
p{font-size:16.5px;line-height:1.5;color:var(--ink2);}
.acoes{margin-top:26px;display:flex;flex-direction:column;gap:12px;}
.btn{display:block;padding:15px 18px;border-radius:999px;font-size:16px;font-weight:600;text-decoration:none;
 border:2px solid var(--roxo);transition:transform .12s ease;}
.btn:active{transform:scale(.97);}
.p{background:var(--roxo);color:#FBF4E6;}
.s{background:transparent;color:var(--roxo);}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px;}
small{display:block;margin-top:26px;font-size:13px;color:var(--ink2);}
small a{color:var(--ink2);}
</style>
</head>
<body>
<main>
  <img class="logo" src="/img/logo.webp" alt="Logótipo do Emma's Place" width="92" height="92">
  <div class="cod" aria-hidden="true">404</div>
  <h1>Esta página não está no menu.</h1>
  <p>O endereço que abriu não existe ou mudou de sítio. Mas o café, o matcha e o açaí continuam à sua espera.</p>
  <div class="acoes">
    <a class="btn p" href="/">Voltar ao início</a>
    <a class="btn s" href="/#menu">Ver o menu e encomendar</a>
  </div>
  <small>Emma's Place · Plateau, Praia · <a href="https://instagram.com/emmasplace.cv" rel="noopener">@emmasplace.cv</a></small>
</main>
</body>
</html>
