<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Vendas ao balcão — Emma's Place</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--cream:#F7F1E4;--card:#FFFCF6;--line:#E7DCC8;--ink:#34251D;--ink2:#785B42;
 --gold:#B8783D;--verde:#4E5937;--verde2:#2F4029;--vermelho:#8C2F2F;}
body{background:var(--cream);color:var(--ink);font-family:'Jost',system-ui,-apple-system,sans-serif;
 padding:12px 12px 90px;}
h1{font-size:19px;letter-spacing:.5px;}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.top small{display:block;color:var(--ink2);font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;}
.pill{background:var(--verde);color:#fff;border:0;border-radius:999px;padding:9px 14px;font:600 12.5px/1 inherit;cursor:pointer;}
.pill.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;}
.fld{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:#fff;
 font:400 15px/1.3 inherit;color:var(--ink);}
.msg{margin-top:8px;font-size:13px;color:var(--ink2);}
.msg.bad{color:var(--vermelho);}
.msg.ok{color:#3F6B33;}

.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:12px;}
.tab .pg{position:absolute;top:-7px;left:-6px;width:15px;height:15px;border-radius:50%;border:2px solid var(--cream);}
.tab .pg.sim{background:#3F6B33;} .tab .pg.nao{background:var(--vermelho);}
.addtab{border:1px dashed var(--gold);background:transparent;color:var(--gold);border-radius:13px;
 padding:11px 6px;font:600 13px/1.2 inherit;cursor:pointer;}
.pagrow{display:flex;gap:8px;margin:12px 0 4px;}
.pagrow button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink2);
 border-radius:11px;padding:11px;font:600 13px/1 inherit;cursor:pointer;}
.pagrow button.sim.sel{background:#3F6B33;border-color:#3F6B33;color:#fff;}
.pagrow button.nao.sel{background:var(--vermelho);border-color:var(--vermelho);color:#fff;}
.notas{margin-top:10px;min-height:64px;resize:vertical;}
.tagpag{border:0;border-radius:999px;padding:5px 10px;font:600 11px/1 inherit;letter-spacing:.6px;
 text-transform:uppercase;cursor:pointer;}
.tagpag.sim{background:#E4EDD8;color:#3F6B33;} .tagpag.nao{background:#F6E4E1;color:var(--vermelho);}
.fecha{position:absolute;bottom:-7px;right:-6px;width:19px;height:19px;border-radius:50%;border:0;
 background:var(--line);color:var(--ink2);font:600 12px/1 inherit;cursor:pointer;}
.tab{position:relative;border:1px solid var(--line);background:var(--card);border-radius:13px;
 padding:11px 6px;font:600 12.5px/1.2 inherit;color:var(--ink2);cursor:pointer;text-align:center;}
.tab.sel{background:var(--verde2);color:#fff;border-color:var(--verde2);}
.tab b{display:block;font-size:15px;margin-bottom:2px;}
.tab .n{position:absolute;top:-7px;right:-6px;min-width:21px;height:21px;border-radius:20px;
 background:var(--gold);color:#fff;font-size:11.5px;display:flex;align-items:center;justify-content:center;padding:0 5px;}

.catrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none;}
.catrow::-webkit-scrollbar{display:none;}
.catrow button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink2);
 border-radius:999px;padding:9px 13px;font:600 12px/1 inherit;cursor:pointer;}
.catrow button.sel{background:var(--gold);color:#fff;border-color:var(--gold);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.prod{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;
 border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;cursor:pointer;
 font:inherit;color:var(--ink);}
.prod:active{transform:scale(.98);}
.prod b{font-size:13.5px;font-weight:600;line-height:1.25;}
.prod span{font-size:12.5px;color:var(--gold);font-weight:600;}
.prod.fora{opacity:.4;pointer-events:none;}
.prod .g{font-size:11px;color:var(--ink2);font-weight:400;}

.linha{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);}
.linha:last-child{border-bottom:0;}
.linha .nm{flex:1;font-size:14px;line-height:1.3;}
.linha .nm small{display:block;color:var(--ink2);font-size:11.5px;}
.linha .pr{font-size:13.5px;font-weight:600;min-width:64px;text-align:right;}
.qtd{display:flex;align-items:center;gap:6px;}
.qtd button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;
 font:600 16px/1 inherit;color:var(--ink);cursor:pointer;}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;
 padding-top:11px;border-top:2px solid var(--ink);font-size:15px;}
.tot b{font-size:22px;}
.envia{width:100%;margin-top:12px;padding:15px;border:0;border-radius:13px;background:var(--verde2);
 color:#fff;font:600 15px/1 inherit;cursor:pointer;}
.envia:disabled{opacity:.4;}
.limpar{width:100%;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:12px;
 background:transparent;color:var(--ink2);font:600 13px/1 inherit;cursor:pointer;}
.vazio{color:var(--ink2);font-size:13.5px;padding:14px 0;text-align:center;}

.ped{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);}
.ped .cod{font-weight:600;font-size:13.5px;}
.ped .it{flex:1;font-size:12.5px;color:var(--ink2);line-height:1.35;}
.est{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:5px 9px;border-radius:999px;}
.est.confirmado{background:#F3E7D2;color:#8A5A12;}
.est.preparar{background:#E4EDD8;color:#3F6B33;}
.est.pronto{background:#2F4029;color:#fff;}
.est.entregue{background:#EFEAE0;color:var(--ink2);}
.sec{font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink2);margin-bottom:9px;}
@media(max-width:520px){ .grid{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<div id="loginBox" class="box" style="max-width:420px;margin:60px auto;">
  <h1>Vendas ao balcão</h1>
  <p class="msg">Chave de acesso:</p>
  <input class="fld" id="fKey" type="password" autocomplete="off" placeholder="Chave"
         onkeydown="if(event.key==='Enter')entrar()">
  <button class="pill" style="width:100%;margin-top:10px;padding:13px" onclick="entrar()">Entrar</button>
  <div class="msg" id="loginMsg"></div>
</div>

<div id="painel" style="display:none">
  <div class="top">
    <div><small id="hoje"></small><h1>Vendas ao balcão</h1></div>
    <button class="pill ghost" onclick="carregarPedidos()">Actualizar</button>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="box">
    <input class="fld" id="fNome" placeholder="Nome do cliente (opcional)" onchange="guardarNome(this.value)">
    <div class="catrow" id="cats" style="margin-top:12px"></div>
    <div class="grid" id="prods"></div>
  </div>

  <div class="box">
    <div class="sec">Pedido do balcão <span id="tabNome"></span></div>
    <div id="linhas"></div>
    <div class="pagrow">
      <button class="sim" id="pgSim" onclick="setPago(true)">Pago</button>
      <button class="nao" id="pgNao" onclick="setPago(false)">Por pagar</button>
    </div>
    <textarea class="fld notas" id="fNotas" placeholder="Notas para a cozinha (sem açúcar, para viagem, alergias…)" onchange="guardarNotas(this.value)"></textarea>
    <div class="tot"><span>Total</span><b id="total">0 ECV</b></div>
    <button class="envia" id="btnEnviar" onclick="enviar()">Enviar para a cozinha</button>
    <button class="limpar" onclick="limpar()">Limpar este balcão</button>
    <div class="msg" id="envMsg"></div>
  </div>

  <div class="box">
    <div class="sec">Balcão — hoje</div>
    <div id="hist"><div class="vazio">Ainda não enviaste nenhum pedido.</div></div>
  </div>
</div>

<script>
const PROMO_API="https://wispy-cherry-ee2e.joaomleal88.workers.dev";
const MENU=[["BEBIDAS QUENTES", [{"n": "Espresso", "m": 85}, {"n": "Espresso Duplo", "m": 150}, {"n": "Latte Clássico", "m": 150, "g": 175, "d": "meia de leite"}, {"n": "Americano", "m": 150, "g": 175}, {"n": "Cappuccino", "m": 175, "g": 200}, {"n": "Mocha Chocolate", "m": 200, "g": 225}, {"n": "Caramelo Latte", "m": 200, "g": 225}]], ["MATCHA & COCO", [{"n": "Iced Matcha Latte", "m": 400, "g": 450}, {"n": "Matcha Crème Frappuccino", "m": 450, "g": 500}, {"n": "Raw Coconut Latte", "m": 450, "g": 500}, {"n": "Iced Caramel Macchiato", "m": 450, "g": 500, "d": "com leite de coco"}]], ["AÇAÍ & ÁGUA DE COCO", [{"n": "Açaí", "m": 750, "d": "tamanho único · granola e fruta fresca"}, {"n": "Água de Coco Grande", "m": 400, "d": "coco grande inteiro · natural, servido no coco"}]], ["BEBIDAS FRIAS", [{"n": "Iced Latte", "m": 225, "g": 250}, {"n": "Café Instantâneo Gelado", "m": 275, "g": 300}, {"n": "Frape Clássico", "m": 275, "g": 300}, {"n": "Frape Chocolate", "m": 325, "g": 350}, {"n": "Frape Caramelo", "m": 350, "g": 375}, {"n": "Iced Caramelo Latte", "m": 350, "g": 375}, {"n": "Iced Mocha", "m": 350, "g": 375}]], ["SUMOS NATURAIS", [{"n": "Sumo de Laranja", "m": 375}, {"n": "Sumo de Maçã", "m": 375}, {"n": "Sumo de Manga", "m": 400}, {"n": "Sumo de Papaia", "m": 450}, {"n": "Sumo de Ananás", "m": 500}]], ["DONUTS & MUFFINS", [{"n": "Muffin Laranja", "m": 125}, {"n": "Muffin Chocolate", "m": 150}, {"n": "Donut Chocolate", "m": 150}, {"n": "Donut Doce de Leite", "m": 150}]], ["MERENDA & PÃO RECHEADO", [{"n": "Merenda Mista", "m": 175, "d": "fiambre, queijo"}, {"n": "Merenda de Chouriço", "m": 175, "d": "chouriço, queijo"}, {"n": "Pão Rech. Frango", "m": 225, "d": "rúcula, queijo, tomate"}, {"n": "Pão Rech. Atum", "m": 250, "d": "queijo, tomate"}, {"n": "Pão Rech. Caprese", "m": 225, "d": "queijo, tomate, molho pesto"}]], ["TOSTAS & WRAPS", [{"n": "Tosta com Manteiga", "m": 120}, {"n": "Tosta Fiambre", "m": 170}, {"n": "Tosta Queijo", "m": 170}, {"n": "Tosta Mista", "m": 200}, {"n": "Wrap de Frango", "m": 425}, {"n": "Wrap de Atum", "m": 450}]], ["ALMOÇO", [{"n": "Sopa do Dia", "m": 300, "d": "pergunte a opção!"}, {"n": "Salada Fria de Frango", "m": 450, "d": "massa espiral, legumes, molho leve"}, {"n": "Salada Fria de Atum", "m": 475, "d": "massa espiral, legumes, molho leve"}, {"n": "Poke Bowl Frango", "m": 650}, {"n": "Poke Bowl Salmão", "m": 700}, {"n": "Poke Bowl Atum", "m": 725}]]];

let KEY="", cat=0, activo=0, pedidos=[];
let balcoes=[novoBalcao(),novoBalcao(),novoBalcao(),novoBalcao()];
let pagoEnviado={};   // estado de pagamento dos pedidos já enviados (só neste aparelho)
function novoBalcao(){ return {nome:"",itens:[],pago:false,notas:""}; }
let esgotados=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

$("hoje").textContent=new Date().toLocaleDateString("pt-PT",
 {weekday:"long",day:"2-digit",month:"long"}).toUpperCase();

/* ---------- ENTRAR ---------- */
async function entrar(){
 KEY=$("fKey").value.trim();
 if(!KEY){ $("loginMsg").className="msg bad"; $("loginMsg").textContent="Escreve a chave."; return; }
 $("loginMsg").className="msg"; $("loginMsg").textContent="A verificar…";
 try{
  const r=await fetch(PROMO_API+"/orders?key="+encodeURIComponent(KEY));
  const d=await r.json();
  if(d.erro){ $("loginMsg").className="msg bad"; $("loginMsg").textContent=d.erro; return; }
  pedidos=d.pedidos||[];
 }catch(e){ $("loginMsg").className="msg bad"; $("loginMsg").textContent="Sem ligação ao servidor."; return; }
 try{ sessionStorage.setItem("ep_vendas_key",KEY); }catch(e){}
 $("loginBox").style.display="none";
 $("painel").style.display="block";
 await Promise.all([aplicarEdicao(), carregarEsgotados()]);
 restaurar(); desenharTabs(); desenharCats(); desenharProdutos(); desenharPedido(); desenharHist();
 setInterval(carregarPedidos, 25000);
 manterEcraAceso();
}
try{ const k=sessionStorage.getItem("ep_vendas_key"); if(k){ $("fKey").value=k; entrar(); } }catch(e){}

/* ---------- MENU: preços e produtos geridos no /admin ---------- */
async function aplicarEdicao(){
 let ed=null;
 try{ const r=await fetch(PROMO_API+"/menu-edit"); const d=await r.json(); if(!d.erro) ed=d.edit||null; }catch(e){}
 if(!ed) return;
 const norm=s=>String(s||"").replace(/&amp;/g,"&").trim().toUpperCase();
 MENU.forEach(c=>c[1].forEach(i=>{
  const o=ed.p&&ed.p[i.n]; if(!o) return;
  if(o.m!=null) i.m=o.m;
  if(o.g!=null) i.g=o.g; else if(o.g===null && "g" in o) delete i.g;
 }));
 (ed.add||[]).forEach(a=>{
  const c=MENU.find(x=>norm(x[0])===norm(a.c)); if(!c) return;
  if(c[1].some(i=>i.n===a.n)) return;
  const novo={n:a.n,m:a.m}; if(a.g) novo.g=a.g; if(a.d) novo.d=a.d;
  c[1].push(novo);
 });
 const off=ed.off||[];
 if(off.length) MENU.forEach(c=>{ c[1]=c[1].filter(i=>!off.includes(i.n)); });
}
async function carregarEsgotados(){
 try{ const r=await fetch(PROMO_API+"/soldout"); const d=await r.json(); esgotados=d.itens||[]; }catch(e){}
}

/* ---------- BALCÕES ---------- */
function guardar(){
 try{
  localStorage.setItem("ep_vendas", JSON.stringify(balcoes));
  localStorage.setItem("ep_vendas_pago", JSON.stringify(pagoEnviado));
 }catch(e){}
}
function restaurar(){
 try{
  const b=JSON.parse(localStorage.getItem("ep_vendas")||"null");
  if(Array.isArray(b)&&b.length) balcoes=b.map(x=>({nome:x.nome||"",itens:x.itens||[],
   pago:!!x.pago,notas:x.notas||""}));
  const p=JSON.parse(localStorage.getItem("ep_vendas_pago")||"null");
  if(p&&typeof p==="object") pagoEnviado=p;
 }catch(e){}
 if(!balcoes.length) balcoes=[novoBalcao()];
 if(activo>=balcoes.length) activo=0;
}
function juntarCliente(){
 if(balcoes.length>=10){ alert("Dez clientes ao mesmo tempo já é de mais."); return; }
 balcoes.push(novoBalcao());
 activo=balcoes.length-1;
 guardar(); desenharTabs(); desenharPedido();
}
function fecharCliente(i,ev){
 if(ev) ev.stopPropagation();
 if(balcoes.length<=1) return;
 if(balcoes[i].itens.length && !confirm("Fechar este cliente? O pedido por enviar perde-se.")) return;
 balcoes.splice(i,1);
 if(activo>=balcoes.length) activo=balcoes.length-1;
 guardar(); desenharTabs(); desenharPedido();
}
function setPago(v){ balcoes[activo].pago=v; guardar(); desenharTabs(); desenharPedido(); }
function guardarNotas(v){ balcoes[activo].notas=v.trim(); guardar(); }
function desenharTabs(){
 $("tabs").innerHTML=balcoes.map((b,i)=>{
  const n=b.itens.reduce((s,x)=>s+x.q,0);
  return `<button class="tab${i===activo?" sel":""}" onclick="irBalcao(${i})">
   ${n?`<span class="pg ${b.pago?"sim":"nao"}"></span>`:""}
   <b>${i+1}</b>${b.nome?esc(b.nome.slice(0,12)):"Cliente"}
   ${n?`<span class="n">${n}</span>`:""}
   ${balcoes.length>1?`<span class="fecha" onclick="fecharCliente(${i},event)">×</span>`:""}</button>`;
 }).join("") + `<button class="addtab" onclick="juntarCliente()">+ Cliente</button>`;
 $("tabNome").textContent=balcoes[activo].nome?("— "+balcoes[activo].nome):("— "+(activo+1));
 $("fNome").value=balcoes[activo].nome||"";
}
function irBalcao(i){ activo=i; desenharTabs(); desenharPedido(); }
function guardarNome(v){ balcoes[activo].nome=v.trim(); guardar(); desenharTabs(); }

/* ---------- PRODUTOS ---------- */
function desenharCats(){
 $("cats").innerHTML=MENU.map((c,i)=>
  `<button class="${i===cat?"sel":""}" onclick="irCat(${i})">${esc(c[0])}</button>`).join("");
}
function irCat(i){ cat=i; desenharCats(); desenharProdutos(); }
function desenharProdutos(){
 const c=MENU[cat];
 $("prods").innerHTML=c[1].map((i,k)=>{
  const fora=esgotados.includes(i.n);
  const g=i.g?`<span class="g">G · ${i.g}</span>`:"";
  return `<button class="prod${fora?" fora":""}" onclick="add(${cat},${k},'M')">
   <b>${esc(i.n)}</b><span>${i.m} ECV</span>${g}${fora?'<span class="g">esgotado</span>':""}</button>`
   + (i.g?`<button class="prod${fora?" fora":""}" onclick="add(${cat},${k},'G')">
   <b>${esc(i.n)} <span class="g">Grande</span></b><span>${i.g} ECV</span></button>`:"");
 }).join("");
}
function add(ci,ii,sz){
 const i=MENU[ci][1][ii];
 const nome=i.n+(sz==="G"?" (Grande)":"");
 const preco=(sz==="G"&&i.g)?i.g:i.m;
 const b=balcoes[activo];
 const ex=b.itens.find(x=>x.nome===nome);
 if(ex) ex.q++; else b.itens.push({nome,preco,q:1});
 guardar(); desenharTabs(); desenharPedido();
}
function mudarQtd(k,d){
 const b=balcoes[activo];
 b.itens[k].q+=d;
 if(b.itens[k].q<=0) b.itens.splice(k,1);
 guardar(); desenharTabs(); desenharPedido();
}
function totalBalcao(){ return balcoes[activo].itens.reduce((s,x)=>s+x.preco*x.q,0); }
function desenharPedido(){
 const b=balcoes[activo];
 $("linhas").innerHTML = b.itens.length ? b.itens.map((x,k)=>`
  <div class="linha">
   <div class="qtd"><button onclick="mudarQtd(${k},-1)">−</button>
    <b>${x.q}</b><button onclick="mudarQtd(${k},1)">+</button></div>
   <div class="nm">${esc(x.nome)}<small>${x.preco} ECV cada</small></div>
   <div class="pr">${x.preco*x.q}</div>
  </div>`).join("") : '<div class="vazio">Toca nos produtos acima para montar o pedido.</div>';
 $("total").textContent=totalBalcao()+" ECV";
 $("btnEnviar").disabled = !b.itens.length;
 $("pgSim").classList.toggle("sel", b.pago===true);
 $("pgNao").classList.toggle("sel", b.pago!==true);
 $("fNotas").value=b.notas||"";
}
function limpar(){
 if(!balcoes[activo].itens.length) return;
 if(!confirm("Limpar o balcão "+(activo+1)+"?")) return;
 balcoes[activo]=novoBalcao();
 guardar(); desenharTabs(); desenharPedido();
}

/* ---------- ENVIAR PARA A COZINHA ---------- */
function novoCodigo(){
 const d=new Date(), p=n=>("0"+n).slice(-2);
 const r="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 let s=""; for(let i=0;i<3;i++) s+=r[Math.floor(Math.random()*r.length)];
 return "BAL-"+p(d.getDate())+p(d.getMonth()+1)+"-"+s;
}
function horaMais(min){
 const d=new Date(Date.now()+min*60000), p=n=>("0"+n).slice(-2);
 return p(d.getHours())+":"+p(d.getMinutes());
}
async function enviar(){
 const b=balcoes[activo];
 if(!b.itens.length) return;
 const btn=$("btnEnviar"); btn.disabled=true;
 const msg=$("envMsg"); msg.className="msg"; msg.textContent="A enviar…";
 const code=novoCodigo();
 const dados={
  code, nome: b.nome || ("Balcão "+(activo+1)), tel:"", modo:"recolha",
  slot: horaMais(5), quando:"hoje", dia:null,
  itens: b.itens.map(x=>`${x.q}x ${x.nome}`),
  total: totalBalcao(),
  notas: "BALCÃO — cliente à espera · " + (b.pago?"PAGO":"POR PAGAR")
         + (b.notas ? " · " + b.notas : ""),
  morada:"", pago:false
 };
 let id=null;
 try{
  const r=await fetch(PROMO_API+"/order",{method:"POST",
   headers:{"Content-Type":"text/plain;charset=UTF-8"}, body:JSON.stringify(dados)});
  if(!r.ok) throw new Error("http "+r.status);
  try{ const d=await r.json(); id=d.id||null; }catch(e){}
 }catch(e){
  msg.className="msg bad"; msg.textContent="Não foi possível enviar. Verifica a ligação e tenta outra vez.";
  btn.disabled=false; return;
 }
 // a cozinha só mostra pedidos confirmados — no balcão a confirmação é imediata
 if(!id){
  try{
   const r=await fetch(PROMO_API+"/orders?key="+encodeURIComponent(KEY));
   const d=await r.json();
   const p=(d.pedidos||[]).find(x=>x.code===code);
   if(p) id=p.id;
  }catch(e){}
 }
 if(id){
  try{ await fetch(PROMO_API+"/order-status?key="+encodeURIComponent(KEY)+"&id="+id+"&st=confirmado",{method:"POST"}); }catch(e){}
 }
 msg.className="msg ok";
 msg.textContent="Enviado para a cozinha · "+code+(id?"":" (confirma no /admin — não consegui confirmar sozinho)");
 pagoEnviado[code]=b.pago;
 balcoes[activo]=novoBalcao();
 guardar(); desenharTabs(); desenharPedido();
 carregarPedidos();
}

/* ---------- O QUE JÁ FOI ENVIADO ---------- */
async function carregarPedidos(){
 try{
  const r=await fetch(PROMO_API+"/orders?key="+encodeURIComponent(KEY));
  const d=await r.json();
  if(!d.erro) pedidos=d.pedidos||[];
 }catch(e){}
 desenharHist();
}
function desenharHist(){
 const l=(pedidos||[]).filter(p=>String(p.code||"").startsWith("BAL-"));
 if(!l.length){ $("hist").innerHTML='<div class="vazio">Ainda não enviaste nenhum pedido.</div>'; return; }
 const ordem={pronto:0,preparar:1,confirmado:2,entregue:3,cancelado:4};
 l.sort((a,b)=>(ordem[a.status]??9)-(ordem[b.status]??9));
 $("hist").innerHTML=l.map(p=>{
  const pg = pagoEnviado[p.code]===true;
  return `<div class="ped">
   <div><div class="cod">${esc(p.code)}</div><div class="it">${esc(p.nome||"")} · ${p.total||0} ECV</div></div>
   <div class="it">${(p.itens||[]).map(esc).join(" · ")}</div>
   <button class="tagpag ${pg?"sim":"nao"}" onclick="alternarPago('${esc(p.code)}')">${pg?"Pago":"Por pagar"}</button>
   <span class="est ${p.status}">${esc(p.status||"")}</span>
  </div>`;
 }).join("");
}
function alternarPago(code){
 pagoEnviado[code] = !(pagoEnviado[code]===true);
 guardar(); desenharHist();
}

/* ---------- ecrã sempre aceso ---------- */
async function manterEcraAceso(){
 try{ if("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch(e){}
}
</script>
